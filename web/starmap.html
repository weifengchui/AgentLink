<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AgentLink · 消息星图 v5</title>
<style>
:root{--ink:#04070d;--panel:rgba(11,17,27,.88);--edge:rgba(108,168,255,.16);--txt:#d7e2ee;--mut:#6b7d94;
--fs:1;--cyan:#38d6e6;--blue:#7fb0ff;--green:#43d97b;--amber:#ffb347;--violet:#c77dff;--red:#ff5c7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none}
#viewport{position:fixed;inset:0;background:
 radial-gradient(1200px 800px at 70% 20%,rgba(56,120,255,.07),transparent 60%),
 radial-gradient(1400px 900px at 55% 42%,#0a1322 0%,#05080f 55%,#03060b 100%),
 linear-gradient(rgba(108,168,255,.045) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(90deg,rgba(108,168,255,.045) 1px,transparent 1px) 0 0/44px 44px,
 radial-gradient(46% 40% at 21% 50%,rgba(56,214,230,.05),transparent 70%),
 radial-gradient(42% 36% at 73% 22%,rgba(127,176,255,.05),transparent 70%),
 radial-gradient(40% 36% at 66% 78%,rgba(199,125,255,.07),transparent 70%),var(--ink)}
#starfield{position:absolute;inset:0;pointer-events:none}
#starfield i{position:absolute;border-radius:50%;background:#cfe3ff;animation:twk var(--d) ease-in-out infinite alternate}
@keyframes twk{from{opacity:.03}to{opacity:.16}}
#scan{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(56,214,230,.022) 50%,transparent 100%);background-size:100% 240px;animation:scan 9s linear infinite;z-index:40}
@keyframes scan{from{background-position:0 -240px}to{background-position:0 100vh}}
#world{position:absolute;inset:0}
#stage{position:absolute;inset:0}
svg#map{position:absolute;inset:0;width:100%;height:100%}
/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
justify-content:space-between;padding:0 26px;z-index:30;pointer-events:none;
background:linear-gradient(180deg,rgba(4,7,13,.82),transparent)}
#brand{display:flex;align-items:center;gap:14px}
#brand h1{font-size:calc(20px*var(--fs));font-weight:600;letter-spacing:3px;color:#cfe4ff;margin:0}
#brand h1 em{font-style:normal;color:var(--cyan)}
#brand .sub{font-size:calc(11px*var(--fs));color:var(--mut);letter-spacing:.6em;border-left:1px solid var(--edge);padding-left:14px;margin-top:4px}
#hud{display:flex;gap:22px;font-size:calc(12px*var(--fs));color:var(--mut)}
#hud b{color:var(--txt);font-size:calc(15px*var(--fs));font-family:ui-monospace,Consolas,monospace}
/* ---------- stations (v1 minimal) ---------- */
/* R5（10-16 第五轮）：节点圆整体再缩一档——orb 直径 46→38；感应盒 150→76（比 orb 大一圈即可，
   配合 R3：鼠标从胶囊走向卡片时不再横穿节点感应区，误收卡组的机会随之大减） */
.station{position:absolute;width:76px;height:76px;transform:translate(-50%,-50%);cursor:grab;z-index:3}
.station.drag{cursor:grabbing}
.station:hover{z-index:4}
.station .orb{position:absolute;inset:19px;border-radius:50%;pointer-events:none;
background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.30),transparent 60%),
radial-gradient(circle at 50% 60%,rgba(12,24,40,.55),rgba(7,13,24,.94) 74%);
border:1.5px solid var(--sc,#7fb0ff);
box-shadow:0 0 24px var(--scg,rgba(127,176,255,.35)),inset 0 0 18px rgba(127,176,255,.12)}
.station .ring{position:absolute;inset:12px;border:1px solid var(--sc,#7fb0ff);border-radius:50%;opacity:.22;pointer-events:none}
.station .pulse{position:absolute;inset:12px;border-radius:50%;border:1px solid var(--sc,#7fb0ff);
opacity:0;animation:stpulse 3.6s ease-in-out infinite;pointer-events:none}
@keyframes stpulse{0%,100%{transform:scale(.8);opacity:0}50%{transform:scale(1.14);opacity:.4}}
.station .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.station .glyph span{font-size:calc(10px*var(--fs));font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;color:#eaf4ff;opacity:.92;text-shadow:0 0 10px var(--scg,rgba(120,190,255,.9))}
.station .lab{position:absolute;top:100%;left:-60px;right:-60px;margin-top:-14px;text-align:center;pointer-events:none}
.station .lab b{font-size:calc(13px*var(--fs));letter-spacing:.12em;color:#d8e6f4;font-weight:600;text-shadow:0 1px 4px #000}
.station .lab i{display:block;font-style:normal;font-size:calc(10.5px*var(--fs));color:#8ea6bd;
font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
.agt{position:absolute;transform:translate(-50%,-50%);cursor:grab;z-index:6}
.agt.drag{cursor:grabbing}
.agt .dot{position:relative;border-radius:14px;display:flex;align-items:center;justify-content:flex-end;height:27px;padding:2px 2px 2px 10px;
background:var(--acn,#1c3a5e);border:1px solid rgba(255,255,255,.13);transition:transform .2s;animation:apulse 3s ease-in-out infinite alternate}
.agt .dot .in{border-radius:999px;padding:0 9px;height:21px;line-height:21px;display:inline-block;
background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.30),transparent 60%),var(--ac,#38d6e6);
color:#061018;font-weight:700;font-size:calc(10.5px*var(--fs));letter-spacing:.03em;white-space:nowrap;
box-shadow:0 0 9px 1px var(--acg,rgba(56,214,230,.42))}
.agt:hover .dot{transform:scale(1.1)}
/* R3（10-16 第四轮）：悬停/钉选节点时，该节点全部 agent 胶囊提亮（归属感反馈） */
.agt.lit .dot{filter:brightness(1.22) saturate(1.12);opacity:1;animation:none;
box-shadow:0 0 16px var(--acg,rgba(56,214,230,.5))}
.agt.lit .badge{box-shadow:0 0 12px color-mix(in srgb,var(--ac,#38d6e6) 60%,transparent)}
@keyframes apulse{from{opacity:.82}to{opacity:1}}

.agt .badge{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
background:#0b1220;border:1px solid var(--ac,#38d6e6);color:#fff;font-size:calc(10.5px*var(--fs));line-height:17px;text-align:center;
box-shadow:0 0 8px color-mix(in srgb,var(--ac) 45%,transparent);
font-family:ui-monospace,Consolas,monospace;z-index:2}
.agt .badge.zero{opacity:.28}
@keyframes ping{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.agt .badge.ping{animation:ping .7s cubic-bezier(.2,1.6,.4,1)}
.agt .flash{position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--ac,#38d6e6);opacity:0;pointer-events:none}
@keyframes fire{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(2.1)}}
.agt .flash.fire{animation:fire .9s ease-out}
/* ---------- links ---------- */
.lk{fill:none;stroke-linecap:round;opacity:0;pointer-events:none;transition:opacity .35s ease}
.lk.on{opacity:.62}
.lk.hl{opacity:1;stroke-width:2.6px;filter:drop-shadow(0 0 5px rgba(160,210,255,.65))}
.lk.temp{opacity:.5}
.lk.lit{opacity:1;stroke-width:2.8px!important;transition:opacity .9s linear}
.dot.glow{box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 16px var(--acg,rgba(140,190,255,.6))}
.station .orb.glow{box-shadow:0 0 26px var(--scg,rgba(127,176,255,.5)),0 0 0 2px rgba(255,255,255,.5)}
.agt.pinned .dot{box-shadow:0 0 0 2px var(--acg,rgba(140,190,255,.5))}
.station.pinned .ring{opacity:.55}
/* ---------- photon ---------- */
.ph{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;z-index:9;pointer-events:none;
background:radial-gradient(circle,#fff,currentColor 55%,transparent 75%);box-shadow:0 0 12px 3px currentColor}
.ph::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
background:currentColor;opacity:.55;box-shadow:0 0 8px 2px currentColor}
/* ---------- group card deck (vertical feather) ---------- */
.dwrap{position:absolute;z-index:20;width:236px}
.dkhit{position:absolute;z-index:0;pointer-events:auto}
.gcard.hot{z-index:99}
.dmore{position:absolute;width:auto;padding:2px 10px;border-radius:10px;font-size:calc(10.5px*var(--fs));color:#9fb4cc;background:rgba(13,20,32,.92);border:1px solid rgba(108,168,255,.35);font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
#legend{position:fixed;left:26px;bottom:92px;color:var(--mut);font-size:calc(11px*var(--fs));z-index:6;
letter-spacing:.06em;display:flex;flex-direction:column;gap:5px;max-width:56vw}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.lgsec{font-size:calc(10px*var(--fs));color:#4f6377;letter-spacing:.16em;margin-right:3px;flex:none}
.lgi{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:2px 9px;border-radius:11px;
border:1px solid rgba(108,168,255,.22);background:rgba(9,14,23,.66);color:#a9bcd2;
font-size:calc(10.5px*var(--fs));user-select:none;transition:all .15s}
.lgi:hover{border-color:rgba(56,214,230,.7);color:#fff}
.lgi.off{opacity:.4;text-decoration:line-through}
.dotl{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.station.hid,.agt.hid{display:none!important}
.gcard{position:absolute;left:0;backdrop-filter:blur(8px);width:236px;height:70px;border-radius:10px;padding:7px 9px;cursor:pointer;
background:rgba(11,17,28,.98);
border:1px solid color-mix(in srgb,var(--gc) 50%,rgba(108,168,255,.2));border-left:3px solid var(--gc);
box-shadow:0 0 20px -8px var(--gc),0 6px 18px rgba(0,0,0,.55);transform-origin:8% 90%;
transition:transform .32s cubic-bezier(.2,.8,.25,1),top .32s cubic-bezier(.2,.8,.25,1),box-shadow .2s,filter .2s}
.gcard .r1{display:flex;align-items:center;gap:8px}
.gcard .cdot{width:7px;height:7px;border-radius:2px;background:var(--gc);box-shadow:0 0 6px var(--gc);flex:none}
.gcard .cname{font-size:calc(13px*var(--fs));font-weight:700;color:#e6eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .cnum{margin-left:auto;font-size:calc(10.5px*var(--fs));color:var(--gc);font-family:ui-monospace,Consolas,monospace;
border:1px solid var(--gc);border-radius:9px;padding:1px 7px;opacity:.85;flex:none}
.gcard .r2{font-size:calc(10.5px*var(--fs));color:#a9bad0;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .r3{font-size:calc(10px*var(--fs));color:var(--mut);margin-top:3px;font-family:ui-monospace,Consolas,monospace;
display:flex;justify-content:space-between}
.gcard.hot{box-shadow:0 0 0 1.5px var(--gc),0 0 30px -6px var(--gc),0 14px 36px rgba(0,0,0,.75);z-index:99;filter:brightness(1.2)}
.gcard.empty{opacity:.55;pointer-events:none}
/* ---------- message viewer (big card) ---------- */
#mask{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(3px);z-index:48;display:none}
#viewer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:50;
display:none;width:min(920px,92vw);height:min(600px,80vh);background:#0b1320;
border:1.5px solid var(--vc,#38d6e6);border-radius:16px;overflow:hidden;
box-shadow:0 0 44px -8px var(--vc,#38d6e6),0 30px 80px rgba(0,0,0,.8);
transition:transform .28s cubic-bezier(.2,1.3,.4,1)}
#viewer.show{display:flex;transform:translate(-50%,-50%) scale(1)}
#vlist{width:280px;flex:none;border-right:1px solid var(--edge);background:rgba(6,10,17,.6);overflow-y:auto;padding:10px}
#vlist .row{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:border-color .15s,background .15s}
#vlist .row:hover{background:rgba(108,168,255,.07)}
#vlist .row.on{border-color:var(--vc);background:color-mix(in srgb,var(--vc) 9%,transparent)}
#vlist .row .k{width:8px;height:8px;border-radius:2px;flex:none;box-shadow:0 0 6px var(--kc)}
#vlist .row .t{font-size:calc(10px*var(--fs));color:var(--mut);flex:none;font-family:ui-monospace,Consolas,monospace}
#vlist .row .s{font-size:calc(11px*var(--fs));color:#b7c6d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
#vmain{flex:1;padding:22px 26px 34px;overflow-y:auto;position:relative}
/* R2（10-16 第五轮）：弹窗内滚动条深色定制——细窄圆角，thumb 随话题主题色 */
#vlist,#vmain{scrollbar-width:thin;scrollbar-color:rgba(127,176,255,.32) rgba(255,255,255,.04)}
#vlist::-webkit-scrollbar,#vmain::-webkit-scrollbar{width:9px;height:9px}
#vlist::-webkit-scrollbar-track,#vmain::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
#vlist::-webkit-scrollbar-thumb,#vmain::-webkit-scrollbar-thumb{border-radius:8px;
background:linear-gradient(180deg,color-mix(in srgb,var(--vc,#38d6e6) 42%,#16233a),color-mix(in srgb,var(--vc,#38d6e6) 22%,#16233a));
border:2px solid transparent;background-clip:content-box}
#vlist::-webkit-scrollbar-thumb:hover,#vmain::-webkit-scrollbar-thumb:hover{
background:linear-gradient(180deg,color-mix(in srgb,var(--vc,#38d6e6) 65%,#1c2b40),color-mix(in srgb,var(--vc,#38d6e6) 40%,#1c2b40));
background-clip:content-box}
/* R2（10-16 第五轮）：上一组/下一组按钮移到弹窗外两侧（fixed，坐标由 posGNav 按窗体矩形贴外缘 12px；
   空间不足才回退内侧贴边）。此前是 #viewer 内部悬浮、遮挡正文被否。 */
.gn{position:fixed;top:50%;z-index:51;width:34px;height:56px;border-radius:10px;
background:rgba(6,10,17,.8);border:1px solid color-mix(in srgb,var(--vc,#38d6e6) 50%,transparent);
color:var(--vc,#38d6e6);font-size:26px;line-height:1;cursor:pointer;padding:0;display:none;
align-items:center;justify-content:center;opacity:.82;transition:opacity .18s,box-shadow .18s,background .18s}
.gn.show{display:flex}
.gn:hover{opacity:1;background:rgba(13,20,32,.94);box-shadow:0 0 16px color-mix(in srgb,var(--vc,#38d6e6) 45%,transparent)}
#v-tp{font-size:calc(17px*var(--fs));font-weight:700;color:var(--vc);padding-right:30px;letter-spacing:.04em}
#v-seq{font-size:calc(11px*var(--fs));color:var(--mut);margin:4px 0 14px;font-family:ui-monospace,Consolas,monospace}
#v-hd{font-size:calc(12.5px*var(--fs));color:#9fb4cc;background:rgba(108,168,255,.06);border:1px dashed var(--edge);
border-left:3px solid var(--vc);border-radius:8px;padding:7px 11px;margin-bottom:12px;word-break:break-all;font-family:ui-monospace,Consolas,monospace}
/* R1（10-17 第八轮）：弹窗路由=对话记录同款双层胶囊（CSS 与 src/api.rs 逐字一致） */
.idc{display:inline-flex;align-items:center;justify-content:flex-end;background:var(--nc,#22344f);border-radius:13px;padding:2px 2px 2px 14px;margin-right:4px;vertical-align:middle;max-width:100%}
.idc .idci{display:inline-block;border-radius:999px;padding:0 9px;font-weight:600;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;vertical-align:middle}
.idn{opacity:.62;font-size:11px;margin-right:2px}
.varr{opacity:.6;font-size:12px;padding:0 4px}
#v-body{font-size:calc(14px*var(--fs));line-height:1.75;color:#eaf2fb;white-space:pre-wrap;word-break:break-all}
#v-meta{margin-top:16px;display:flex;gap:16px;align-items:center;font-size:calc(11.5px*var(--fs));color:var(--mut);font-family:ui-monospace,Consolas,monospace}
#v-kind{border:1px solid var(--vc);color:var(--vc);border-radius:9px;padding:1px 9px}
#v-x{position:absolute;top:10px;right:12px;font-size:calc(12px*var(--fs));color:var(--mut);cursor:pointer;z-index:2;padding:3px 10px;border:1px solid rgba(140,170,200,.35);border-radius:7px}
#v-x:hover{color:#fff}
#viewer .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:calc(10px*var(--fs));color:#3f5065;letter-spacing:.18em;pointer-events:none}
/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:22px;padding:0 26px;z-index:30;
background:linear-gradient(0deg,rgba(4,7,13,.85),transparent)}
#bar .lbl{font-size:calc(11px*var(--fs));color:var(--mut);letter-spacing:.18em;white-space:nowrap}
#win,#back{-webkit-appearance:none;appearance:none;width:220px;height:3px;border-radius:2px;background:#1b2a40;outline:none;cursor:pointer}
#win::-webkit-slider-thumb,#back::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--cyan);
box-shadow:0 0 12px var(--cyan);cursor:pointer}
#winv{font-size:calc(12px*var(--fs));color:var(--cyan);font-family:ui-monospace,Consolas,monospace;width:52px}
#rng{font-size:calc(12.5px*var(--fs));color:#cfe4ff;font-family:ui-monospace,Consolas,monospace;width:118px;white-space:nowrap}
#bar .btns{margin-left:auto;display:flex;gap:10px}
.btn{font-size:calc(12px*var(--fs));color:#a9bcd2;border:1px solid var(--edge);border-radius:8px;padding:6px 14px;cursor:pointer;
background:rgba(11,17,27,.7);letter-spacing:.12em;transition:all .18s}
.btn:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 14px rgba(56,214,230,.3)}
.btn.on{color:var(--cyan);border-color:var(--cyan)}
</style>
</head>
<body>
<div id="scan"></div>
<div id="viewport"><div id="starfield"></div><div id="world">
  <div id="stage" data-page="starmap">
    <svg id="map"></svg>
  </div>
</div></div>
<div id="topbar">
  <div id="brand"><h1>AGENT<em>LINK</em> · 消息星图</h1></div>
  <div id="hud"></div>
</div>
<div id="bar">
  <span class="lbl">窗口长度</span><input id="win" type="range" min="60" max="1800" step="60" value="600"><span id="winv">10min</span>
  <span class="lbl">时间区间</span><input id="back" type="range" min="0" max="3600" step="60" value="0"><span id="rng"></span>
  <div class="btns">
    <div class="btn" id="bReset">复位</div>
    <div class="btn" id="bPause">流入</div>
    <div class="btn" id="bSnap">截图</div>
    <div class="btn" id="bRec">录屏</div>
    <div class="btn" id="bFs">全屏</div>
  </div>
</div>
<div id="mask"></div>
<div id="legend"></div>
<div id="viewer">
  <div id="vlist"></div>
  <div id="vmain">
   <span id="v-x">关闭</span>
   <div id="v-tp"></div>
   <div id="v-seq"></div>
   <div id="v-hd"></div>
   <div id="v-body"></div>
   <div id="v-meta"><span id="v-time"></span><span id="v-kind"></span><span id="v-route"></span></div>
  </div>
  <div class="hint">点条目 / 滚轮 / ← → 翻页 · Shift+← → 换组 · ESC 关闭</div>
</div>
<button type="button" class="gn" id="gPrev" title="上一组话题（Shift+←）">‹</button>
<button type="button" class="gn" id="gNext" title="下一组话题（Shift+→）">›</button>
<script>

const stageEl=document.getElementById("stage"),map=document.getElementById("map"),
hud=document.getElementById("hud");
let W=innerWidth,H=innerHeight;
const CUR={x:innerWidth/2,y:innerHeight/2};
addEventListener("pointermove",e=>{CUR.x=e.clientX;CUR.y=e.clientY},{passive:true});
function barH(){const b=document.getElementById("bar");return b?b.offsetHeight:56}
// R5（10-16 第五轮）：节点圆缩小后，胶囊轨道同步收档（46–66 → 40–56）
function orbR(){return Math.max(40,Math.min(56,(H-barH()-84)/7.2))}
function staClamp(){const top=90,bot=Math.max(top+60,H-barH()-orbR()-30);return{top,bot}}
const MACH={};let SELF=null,NODES=[],NAMES={},COLORS={},ST_ON=0,ST_ALL=0,AG_ALL=0;
/* R6（10-16 第三轮）：图例点选显隐。hideNodes 按 node_id、hideAgt 按 agent_id 全局（与 R1 全局同色语义一致）；
   统一在 activeMsgs 出口过滤 → 站台、卫星、卡组、徽章、HUD 一个口径，隐藏即整体从画面消失。localStorage 持久化。 */
const hideNodes=new Set(),hideAgt=new Set();
try{const _sh=JSON.parse(localStorage.getItem("starhide")||"{}");for(const x of(_sh.n||[]))hideNodes.add(x);for(const x of(_sh.a||[]))hideAgt.add(x);}catch(e){}
function saveHide(){try{localStorage.setItem("starhide",JSON.stringify({n:[...hideNodes],a:[...hideAgt]}))}catch(e){}}

 e.target.classList.toggle("on",paused);e.target.textContent=paused?"⏸︎流入":"流入";};
document.getElementById("bReset").onclick=()=>{cancelLiveAnims();clearPin();
 for(const o of[STA,AGTP])for(const k in o)delete o[k];
 applyDefaultLayout();initPos();placeWorld();renderLinks();renderAllDecks();};
document.getElementById("bFs").onclick=()=>{
 // 本页可能被总览 iframe 嵌入：全屏请求要打在宿主 iframe 元素上（iframe 内部对 body 发请求会被拒），
 // 再点一次 = 退出当前全屏（无论全屏是本页还是外层按钮触发的）。
 let fe=null;try{fe=window.frameElement}catch(e){}
 const doc=fe?fe.ownerDocument:document;
 if(doc.fullscreenElement){doc.exitFullscreen().catch(()=>{});return;}
 const tgt=fe||document.documentElement;
 let p=null;try{p=tgt.requestFullscreen()}catch(e){p=Promise.reject(e)}
 if(p&&p.catch)p.catch(()=>{try{document.body.requestFullscreen().catch(()=>{})}catch(e){}});
};
document.getElementById("bSnap").onclick=snapshot;
let recorder=null,recTimer=null;
document.getElementById("bRec").onclick=e=>{
 if(recorder){recorder.stop();recorder=null;clearInterval(recTimer);e.target.classList.remove("on");e.target.textContent="录屏";return;}
 const cv=document.createElement("canvas");cv.width=W;cv.height=H;
 const stream=cv.captureStream(30);recorder=new MediaRecorder(stream,{mimeType:"video/webm"});
 const chunks=[];recorder.ondataavailable=ev=>chunks.push(ev.data);
 recorder.onstop=()=>{const a=document.createElement("a");a.download="agentlink-star-"+Date.now()+".webm";
  a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.click();};
 recorder.start();e.target.classList.add("on");e.target.textContent="停止";
 const g=cv.getContext("2d");
 recTimer=setInterval(()=>{snapshotTo(g);
  for(const el of document.querySelectorAll(".ph")){const r=el.getBoundingClientRect();
   g.beginPath();g.arc(r.left+5,r.top+5,5,0,7);g.fillStyle=el.style.color;
   g.shadowColor=el.style.color;g.shadowBlur=16;g.fill();g.shadowBlur=0;}},33);
 setTimeout(()=>{if(recorder)e.target.click();},12000);};
function snapshot(){const cv=document.createElement("canvas");cv.width=W;cv.height=H;const g=cv.getContext("2d");
 snapshotTo(g);
 const a=document.createElement("a");a.download="agentlink-star-"+Date.now()+".png";a.href=cv.toDataURL("image/png");a.click();}
function snapshotTo(g){
 g.fillStyle="#04070d";g.fillRect(0,0,W,H);
 for(const m in MACH){const c=MACH[m];const s=STA[m];
  hexPath(g,s.x,s.y,66);g.strokeStyle=c.col;g.globalAlpha=.8;g.lineWidth=2;g.stroke();g.globalAlpha=.07;
  g.fillStyle=c.col;g.fill();g.globalAlpha=1;
  g.fillStyle="#cfe3ff";g.font="13px Consolas";g.textAlign="center";g.fillText(c.lab+" "+c.ip,s.x,s.y-88);}
 for(const k in agtEl){const p=agPos(k);g.beginPath();g.arc(p.x,p.y,10,0,7);
  g.fillStyle=MACH[k.split("|")[0]].col;g.shadowColor=g.fillStyle;g.shadowBlur=14;g.fill();g.shadowBlur=0;
  g.fillStyle="#fff";g.font="10px Consolas";g.fillText(recvCount(k),p.x+16,p.y-10);}
 for(const l of LINKS){const p1=agPos(l.f),p2=agPos(l.t);
  const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,L2=Math.hypot(dx,dy)||1,b=bowOf(l.key);
  g.beginPath();g.moveTo(p1.x,p1.y);g.quadraticCurveTo(mx+(-dy/L2)*b,my+(dx/L2)*b,p2.x,p2.y);
  g.strokeStyle=l.color;g.globalAlpha=.4;g.lineWidth=1.2;g.stroke();g.globalAlpha=1;}
 g.textAlign="left";}
function hexPath(g,x,y,r){g.beginPath();for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/2;
 const px=x+Math.cos(a)*r,py=y+Math.sin(a)*r;i?g.lineTo(px,py):g.moveTo(px,py);}g.closePath();}
/* ---------- boot ---------- */
let W0=innerWidth,H0=innerHeight;
function sizeUp(){W=innerWidth;H=innerHeight;if(W===W0&&H===H0&&Object.keys(STA).length)return;
 if(!Object.keys(STA).length){W0=W;H0=H;return;}
 const rx=W/W0,ry=H/H0;W0=W;H0=H;
 for(const m in STA){STA[m].x*=rx;STA[m].y*=ry;}
 const cl=staClamp(),r=orbR();
 for(const m in STA)STA[m].y=Math.max(cl.top,Math.min(cl.bot,STA[m].y));
 for(const k in AGTP){const mag=Math.hypot(AGTP[k].dx,AGTP[k].dy)||1;AGTP[k].dx*=r/mag;AGTP[k].dy*=r/mag;}
 placeWorld();renderLinks();renderAllDecks();}
function buildStars(){const sf=document.getElementById("starfield");
 for(let i=0;i<110;i++){const t=document.createElement("i");const sz=1+Math.random()*1.8;
  t.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${(2+Math.random()*4).toFixed(1)}s;animation-delay:${(-Math.random()*5).toFixed(1)}s`;sf.appendChild(t);}}
async function boot(){buildStars();updateRange();await poll();}
addEventListener("resize",sizeUp);
addEventListener("resize",posGNav); /* R2：窗口尺寸变了，‹ › 的外贴坐标要重算（世界布局由 sizeUp 与下轮 poll 处理） */
boot();setInterval(poll,5000);

</script>
