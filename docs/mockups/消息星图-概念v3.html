<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AgentLink · 消息星图 — 概念 v3</title>
<style>
:root{--ink:#04070d;--panel:rgba(11,17,27,.92);--edge:rgba(108,168,255,.14);
--txt:#d7e2ee;--mut:#6b7d94;--cyan:#38d6e6;--red:#ff5c7a;--green:#43d97b;--blue:#7fb0ff;--amber:#ffb347}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.mono{font-family:Cascadia Code,Consolas,monospace}
#bg{position:fixed;inset:0;background:
 radial-gradient(1200px 700px at 20% 30%,rgba(56,214,230,.07),transparent 60%),
 radial-gradient(1000px 600px at 80% 60%,rgba(127,176,255,.06),transparent 60%),
 linear-gradient(rgba(108,168,255,.045) 1px,transparent 1px) 0 0/56px 56px,
 linear-gradient(90deg,rgba(108,168,255,.045) 1px,transparent 1px) 0 0/56px 56px,var(--ink)}
#viewport{position:fixed;inset:0;overflow:hidden}
#world{position:absolute;inset:0;transition:transform .9s cubic-bezier(.22,.8,.28,1);transform-origin:0 0}
#stage{position:absolute;inset:0}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.chan{fill:none;stroke-linecap:round}
.chan.f{stroke:var(--cyan);stroke-width:1.6;opacity:.8}
.chan.r{stroke:var(--blue);stroke-width:1.2;opacity:.55;stroke-dasharray:7 5}
.chan.idle{opacity:.12}
.chan.alarm{stroke:var(--red)!important;opacity:1!important;animation:alarm 1s infinite}
@keyframes alarm{0%,100%{stroke-width:1.6}50%{stroke-width:3.4}}
/* stations */
.stn{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:pointer}
.stn .hex{width:96px;height:84px;position:relative}
.stn .hex svg{position:static;width:96px;height:84px}
.stn .nm{margin-top:2px;font-size:13px;font-weight:600;letter-spacing:.06em}
.stn .ip{font-size:10px;color:var(--mut)}
.stn .ag{display:flex;gap:5px;justify-content:center;margin-top:6px}
.stn .dot{width:9px;height:9px;border-radius:50%;background:var(--ac);
 box-shadow:0 0 8px var(--ac);animation:breathe 2.6s infinite}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:.35}}
.stn .dot.off{background:#555;box-shadow:none;animation:none}
.stn .stat{position:absolute;top:-2px;right:-6px;width:12px;height:12px;border-radius:50%;
 background:var(--green);box-shadow:0 0 10px var(--green);animation:breathe 2s infinite}
.stn.warn .stat{background:var(--amber);box-shadow:0 0 10px var(--amber)}
.stn.down .stat{background:var(--red);box-shadow:0 0 14px var(--red);animation:alarm 1s infinite}
/* message cards & decks */
.deck{position:absolute;transform:translate(-50%,-50%);cursor:pointer;--bc:var(--cyan)}
.deck .card{position:absolute;left:50%;top:0;margin-left:-88px;width:176px;height:92px;
 background:rgba(13,20,32,.94);border:1px solid rgba(108,168,255,.25);border-radius:10px;
 padding:7px 9px;transform-origin:center;
 transform:translateY(calc(var(--i)*-6px)) translateX(calc(var(--i)*4px)) rotate(calc(var(--i)*1.6deg)) scale(calc(1 - var(--i)*.02));
 box-shadow:0 6px 18px rgba(0,0,0,.55);transition:transform .22s,box-shadow .15s;overflow:hidden}
.deck.open .card,.deck.pin .card{
 transform:translateX(calc((var(--i) - var(--m))*52px)) translateY(calc((var(--i) - var(--m))*7px))
           rotate(calc((var(--i) - var(--m))*4deg))}
.card .hd{font-size:9.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .k{position:absolute;left:9px;top:7px;width:7px;height:7px;border-radius:2px;background:var(--kc)}
.card .t{font-size:11px;font-weight:600;margin:14px 0 3px 12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sn{font-size:10.5px;line-height:1.45;color:#a9bad0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .ft{position:absolute;bottom:6px;right:9px;font-size:9px;color:var(--mut)}
.card.hot{z-index:40!important;box-shadow:0 0 0 1.5px var(--bc),0 0 22px -6px var(--bc),0 10px 26px rgba(0,0,0,.6)!important}
.card.sel{z-index:41!important;box-shadow:0 0 0 2px var(--bc),0 0 30px -6px var(--bc),0 10px 26px rgba(0,0,0,.6)!important}
.card.sel::after{content:"✓ 正在查看";position:absolute;top:-15px;left:0;font-size:9px;color:var(--bc)}
.deck .tag{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:9.5px;
 color:var(--mut);background:rgba(6,10,17,.8);border:1px solid var(--edge);border-radius:8px;padding:1px 8px;white-space:nowrap}
.deck.open .tag,.deck.pin .tag{color:var(--bc);border-color:var(--bc)}
/* reader dock card */
#reader{position:absolute;z-index:90;display:none;width:284px;transform:translateX(-50%);cursor:pointer;
 transition:left .2s,top .2s;filter:drop-shadow(0 0 26px rgba(56,214,230,.22))}
#reader .cap{position:absolute;top:-30px;left:0;right:0;text-align:center;font-size:11.5px;color:var(--txt);
 background:rgba(8,14,24,.96);border:1px solid var(--edge);border-radius:9px;padding:3px 8px}
#reader .box{background:#0b1320;border:2px solid var(--rc,var(--cyan));border-radius:14px;
 box-shadow:0 0 34px -6px var(--rc,var(--cyan)),0 14px 40px rgba(0,0,0,.7);padding:11px 14px}
#reader .rk{display:inline-block;font-size:10px;border-radius:4px;padding:1px 7px;color:#04070d;font-weight:700}
#reader .rh{font-size:11.5px;color:#9fb4cc;margin:7px 0 4px;word-break:break-all}
#reader .rb{font-size:13px;line-height:1.6;color:#eaf2fb;max-height:120px;overflow:hidden}
#reader .nf{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:10.5px;color:var(--mut)}
#reader .nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:58px;border-radius:12px;
 background:rgba(13,20,32,.96);border:1.5px solid var(--rc,var(--edge));display:flex;align-items:center;justify-content:center;
 font-size:24px;color:var(--txt);cursor:pointer;transition:background .12s,transform .12s;pointer-events:auto}
#reader .nav:hover{background:var(--rc);color:#04070d;transform:translateY(-50%) scale(1.08)}
#reader .nav:active{transform:translateY(-50%) scale(.92)}
#reader .nav.l{left:-46px}#reader .nav.r{right:-46px}
/* HUD */
#hud{position:fixed;top:14px;right:16px;z-index:110;display:flex;gap:8px}
.hud{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:6px 12px;font-size:11px;color:var(--mut)}
.hud b{display:block;font-size:17px;color:var(--txt);font-weight:600}
.hud.alarmn{color:var(--red)}.hud.alarmn b{color:var(--red)}
#brand{position:fixed;top:16px;left:18px;z-index:110;font-size:15px;letter-spacing:.14em;color:#cfe0f2}
#brand small{color:var(--mut);letter-spacing:.05em;margin-left:8px}
#banner{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:120;display:none;
 background:rgba(60,10,20,.92);border:1px solid var(--red);border-radius:10px;padding:7px 18px;
 font-size:13px;color:#ffd7de;box-shadow:0 0 30px rgba(255,92,122,.35);animation:alarm 1.2s infinite}
/* toolbar */
#bar{position:fixed;bottom:0;left:0;right:0;z-index:110;display:flex;align-items:center;gap:10px;
 padding:10px 16px;background:linear-gradient(transparent,rgba(4,7,13,.9) 30%)}
.btn{background:var(--panel);border:1px solid var(--edge);color:var(--txt);border-radius:9px;
 padding:6px 13px;font-size:12px;cursor:pointer}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.on{background:rgba(56,214,230,.16);border-color:var(--cyan);color:var(--cyan)}
.btn.rec{color:var(--red)}
#recdot{display:none;width:9px;height:9px;border-radius:50%;background:var(--red);animation:breathe 1s infinite}
#reclabel{display:none;font-size:11px;color:var(--red)}
.winlbl{font-size:11px;color:var(--mut);min-width:150px}
input[type=range]{width:180px;accent-color:var(--cyan)}
#help{position:fixed;bottom:52px;left:16px;z-index:100;font-size:10.5px;color:var(--mut);line-height:1.7}
/* detail modal master-detail */
#detail{position:fixed;inset:0;z-index:200;display:none;background:rgba(2,4,8,.72);backdrop-filter:blur(3px)}
#detail.show{display:flex;align-items:center;justify-content:center}
#dwrap{display:flex;width:min(920px,92vw);height:min(600px,80vh);background:#0b1320;--dtc:var(--cyan);
 border:1.5px solid var(--dtc);border-radius:16px;overflow:hidden;
 box-shadow:0 0 44px -8px var(--dtc),0 30px 80px rgba(0,0,0,.8)}
#dlist{width:280px;border-right:1px solid var(--edge);overflow-y:auto;background:rgba(6,10,17,.6);padding:10px}
#dlist .row{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
#dlist .row:hover{background:rgba(108,168,255,.07)}
#dlist .row.on{border-color:var(--dtc);background:color-mix(in srgb,var(--dtc) 9%,transparent)}
#dlist .row .k{width:8px;height:8px;border-radius:2px;flex:none}
#dlist .row .t{font-size:10px;color:var(--mut);flex:none}
#dlist .row .s{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dmain{flex:1;padding:22px 26px;overflow-y:auto}
#d-tp{font-size:17px;font-weight:700;color:var(--dtc)}
#d-seq{font-size:11px;color:var(--mut);margin:4px 0 14px}
#d-hd{font-size:12.5px;color:#9fb4cc;background:rgba(108,168,255,.06);border:1px dashed var(--edge);
 border-left:3px solid var(--dtc);border-radius:8px;padding:7px 11px;margin-bottom:12px;word-break:break-all}
#d-body{font-size:14px;line-height:1.75;white-space:pre-wrap}
#d-meta{margin-top:16px;font-size:11.5px;color:var(--mut)}
#dclose{position:absolute;top:10px;right:14px;font-size:20px;color:var(--mut);cursor:pointer}
#dcard{position:relative}
/* toast */
#toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);z-index:300;background:var(--panel);
 border:1px solid var(--cyan);border-radius:10px;padding:8px 18px;font-size:12.5px;display:none;
 box-shadow:0 0 26px rgba(56,214,230,.25)}
</style>
</head>

  a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.click();
  document.getElementById("recdot").style.display="none";label.textContent="";
  toast("已保存星图动态影像 webm（"+dur+"s）");that._busy=0;};
 mr.start();
 const g=c.getContext("2d");let t0=performance.now();
 (function draw(){const el=(performance.now()-t0)/1000;
  const src=canvasTwin();g.drawImage(src,0,0);
  /* moving particles overlay */
  for(const ch of svg.querySelectorAll(".chan")){const L=ch.getTotalLength();
   const rev=ch.classList.contains("r");const tt=((rev?1-el/4:el/4)%1+1)%1;
   const p=ch.getPointAtLength(L*tt);const x=p.x*(c.width/innerWidth),y=p.y*(c.height/(innerHeight-120));
   g.fillStyle=ch.classList.contains("alarm")?"#ff5c7a":(rev?"#7fb0ff":"#38d6e6");
   g.shadowColor=g.fillStyle;g.shadowBlur=10;g.beginPath();g.arc(x,y,5,0,7);g.fill();g.shadowBlur=0;}
  g.fillStyle="rgba(255,92,122,"+(Math.sin(el*4)>0?".9":".3")+")";g.beginPath();g.arc(40,40,10,0,7);g.fill();
  g.fillStyle="#ffd7de";g.font="16px monospace";g.textAlign="left";
  g.fillText("REC "+(dur-Math.min(el,dur)).toFixed(1)+"s",60,46);
  label.textContent=(dur-Math.min(el,dur)).toFixed(1)+"s";
  if(el<dur&&!document.hidden)requestAnimationFrame(draw);else mr.stop();})();
 const that=this;});
/* ---- toast ---- */
let toastIV=null;
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.style.display="block";
 clearTimeout(toastIV);toastIV=setTimeout(()=>t.style.display="none",2600);}
/* ---- fullscreen ---- */
document.getElementById("bFull").addEventListener("click",()=>{
 if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen();});
/* ---- refresh guard: never rebuild decks while user is picking ---- */
let lastMsgHash=0;
function msgHash(){return TOPICS.reduce((s,t)=>s+t.msgs.length,0);}
function liveRefresh(){setInterval(()=>{
 if(msgHash()===lastMsgHash)return;lastMsgHash=msgHash();
 const busy=dkEl.querySelector(".deck.open,.deck.pin")||
  [...dkEl.querySelectorAll(".card")].some(c=>c.matches(":hover"));
 if(busy){setTimeout(liveRefreshOne,1500);return;}
 buildDecks(document.getElementById("win").value>=600?null:+document.getElementById("win").value);
 hud();},8000);}
function liveRefreshOne(){if(dkEl.querySelector(".deck.open,.deck.pin")){setTimeout(()=>liveRefreshOne(),1500);return;}
 buildDecks(document.getElementById("win").value>=600?null:+document.getElementById("win").value);hud();}
/* ---- keyboard ---- */
addEventListener("keydown",ev=>{
 if(ev.key==="Escape"){closeDetail();if(tour){clearInterval(tour);tour=null;document.getElementById("bTour").classList.remove("on");world.style.transform="";}}
 if(detail.classList.contains("show")&&DT){
  if(ev.key==="ArrowRight"){DT.mi=Math.min(DT.msgs.length-1,DT.mi+1);fill();}
  if(ev.key==="ArrowLeft"){DT.mi=Math.max(0,DT.mi-1);fill();}}
 if(ev.key.toLowerCase()==="f")document.getElementById("bFull").click();});
addEventListener("resize",()=>{layout();renderStations();buildDecks(null);ensureReader();});
/* boot */
layout();renderStations();buildDecks(null);hud();winLbl(600);liveRefresh();requestAnimationFrame(loop);
</script>
