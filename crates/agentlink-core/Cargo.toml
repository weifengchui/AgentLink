[package]
name = "agentlink-core"
version = "0.6.1"
edition = "2021"
description = "AgentLink core - LAN message bus transport (open source)"
repository = "https://github.com/weifengchui/AgentLink"
homepage = "https://github.com/weifengchui/AgentLink"
documentation = "https://docs.rs/agentlink-core"
license = "Apache-2.0"

[features]
default = []
mdns = ["dep:mdns-sd"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util", "fs", "macros"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4"] }
sha2 = { version = "0.10", features = ["oid"] }
hmac = "0.12"
hex = "0.4"
socket2 = "0.5"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
regex = "1"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
local-ip-address = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
mdns-sd = { version = "0.11", optional = true }
ed25519-compact = "2"
# mTLS 传输类型出现在 MeshBridge trait 签名（tls_client_config），纯 Rust ring provider。
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
