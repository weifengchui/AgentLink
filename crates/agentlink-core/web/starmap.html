<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>AgentLink · 消息星图 v5</title>
<style>
:root{--ink:#04070d;--panel:rgba(11,17,27,.88);--edge:rgba(108,168,255,.16);--txt:#d7e2ee;--mut:#6b7d94;
--fs:1;--cyan:#38d6e6;--blue:#7fb0ff;--green:#43d97b;--amber:#ffb347;--violet:#c77dff;--red:#ff5c7a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink);color:var(--txt);
font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;user-select:none}
#viewport{position:fixed;inset:0;background:
 radial-gradient(1200px 800px at 70% 20%,rgba(56,120,255,.07),transparent 60%),
 radial-gradient(1400px 900px at 55% 42%,#0a1322 0%,#05080f 55%,#03060b 100%),
 linear-gradient(rgba(108,168,255,.045) 1px,transparent 1px) 0 0/44px 44px,
 linear-gradient(90deg,rgba(108,168,255,.045) 1px,transparent 1px) 0 0/44px 44px,
 radial-gradient(46% 40% at 21% 50%,rgba(56,214,230,.05),transparent 70%),
 radial-gradient(42% 36% at 73% 22%,rgba(127,176,255,.05),transparent 70%),
 radial-gradient(40% 36% at 66% 78%,rgba(199,125,255,.07),transparent 70%),var(--ink)}
#starfield{position:absolute;inset:0;pointer-events:none}
#starfield i{position:absolute;border-radius:50%;background:#cfe3ff;animation:twk var(--d) ease-in-out infinite alternate}
@keyframes twk{from{opacity:.03}to{opacity:.16}}
#scan{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent 0%,rgba(56,214,230,.022) 50%,transparent 100%);background-size:100% 240px;animation:scan 9s linear infinite;z-index:40}
@keyframes scan{from{background-position:0 -240px}to{background-position:0 100vh}}
#world{position:absolute;inset:0}
#stage{position:absolute;inset:0}
svg#map{position:absolute;inset:0;width:100%;height:100%}
/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;
justify-content:space-between;padding:0 26px;z-index:30;pointer-events:none;
background:linear-gradient(180deg,rgba(4,7,13,.82),transparent)}
#brand{display:flex;align-items:center;gap:14px}
#brand h1{font-size:calc(20px*var(--fs));font-weight:600;letter-spacing:3px;color:#cfe4ff;margin:0}
#brand h1 em{font-style:normal;color:var(--cyan)}
#brand .sub{font-size:calc(11px*var(--fs));color:var(--mut);letter-spacing:.6em;border-left:1px solid var(--edge);padding-left:14px;margin-top:4px}
#hud{display:flex;gap:22px;font-size:calc(12px*var(--fs));color:var(--mut)}
#hud b{color:var(--txt);font-size:calc(15px*var(--fs));font-family:ui-monospace,Consolas,monospace}
/* ---------- stations (v1 minimal) ---------- */
/* R5（10-16 第五轮）：节点圆整体再缩一档——orb 直径 46→38；感应盒 150→76（比 orb 大一圈即可，
   配合 R3：鼠标从胶囊走向卡片时不再横穿节点感应区，误收卡组的机会随之大减） */
.station{position:absolute;width:76px;height:76px;transform:translate(-50%,-50%);cursor:grab;z-index:3}
.station.drag{cursor:grabbing}
.station:hover{z-index:4}
.station .orb{position:absolute;inset:19px;border-radius:50%;pointer-events:none;
background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.30),transparent 60%),
radial-gradient(circle at 50% 60%,rgba(12,24,40,.55),rgba(7,13,24,.94) 74%);
border:1.5px solid var(--sc,#7fb0ff);
box-shadow:0 0 24px var(--scg,rgba(127,176,255,.35)),inset 0 0 18px rgba(127,176,255,.12)}
.station .ring{position:absolute;inset:12px;border:1px solid var(--sc,#7fb0ff);border-radius:50%;opacity:.22;pointer-events:none}
.station .pulse{position:absolute;inset:12px;border-radius:50%;border:1px solid var(--sc,#7fb0ff);
opacity:0;animation:stpulse 3.6s ease-in-out infinite;pointer-events:none}
@keyframes stpulse{0%,100%{transform:scale(.8);opacity:0}50%{transform:scale(1.14);opacity:.4}}
.station .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.station .glyph span{font-size:calc(10px*var(--fs));font-family:ui-monospace,Consolas,monospace;letter-spacing:.04em;color:#eaf4ff;opacity:.92;text-shadow:0 0 10px var(--scg,rgba(120,190,255,.9))}
.station .lab{position:absolute;top:100%;left:-60px;right:-60px;margin-top:-14px;text-align:center;pointer-events:none}
.station .lab b{font-size:calc(13px*var(--fs));letter-spacing:.12em;color:#d8e6f4;font-weight:600;text-shadow:0 1px 4px #000}
.station .lab i{display:block;font-style:normal;font-size:calc(10.5px*var(--fs));color:#8ea6bd;
font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
.agt{position:absolute;transform:translate(-50%,-50%);cursor:grab;z-index:6}
.agt.drag{cursor:grabbing}
/* R6（10-17 第十轮）：胶囊按图扁平化——去白描边（transparent 占位保几何）、圆角对齐弹窗 13px、
   内芯纯色平面（无径向高光无 box-shadow 发光）、hover 微动效与对话记录统一为 cap-nudge */
.agt .dot{position:relative;border-radius:13px;display:flex;align-items:center;justify-content:flex-end;height:27px;padding:2px 2px 2px 10px;
 background:var(--acn,#1c3a5e);border:1px solid transparent;transition:border-color .18s,filter .18s;animation:apulse 3s ease-in-out infinite alternate}
.agt .dot .in{border-radius:999px;padding:0 9px;height:21px;line-height:21px;display:inline-block;
 background:var(--ac,#38d6e6);color:#0b1420;font-weight:600;font-size:calc(10.5px*var(--fs));letter-spacing:.03em;white-space:nowrap}
/* 悬停内胶囊左右缓晃一次复位（与 api.rs cap-nudge 逐字同源） */
@keyframes cap-nudge{0%,100%{transform:translateX(0)}18%{transform:translateX(-5px)}42%{transform:translateX(4px)}64%{transform:translateX(-2.5px)}82%{transform:translateX(1.5px)}}
.agt:hover .dot .in{animation:cap-nudge .7s cubic-bezier(.34,1.2,.64,1) 1}
@media (prefers-reduced-motion:reduce){.agt:hover .dot .in{animation:none}}
/* R3（10-16 第四轮）：悬停/钉选节点时，该节点全部 agent 胶囊提亮（归属感反馈） */
.agt.lit .dot{filter:brightness(1.22) saturate(1.12);opacity:1;animation:none}
.agt.lit .badge{box-shadow:0 0 12px color-mix(in srgb,var(--ac,#38d6e6) 60%,transparent)}
@keyframes apulse{from{opacity:.82}to{opacity:1}}

.agt .badge{position:absolute;top:-7px;right:-9px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
background:#0b1220;border:1px solid var(--ac,#38d6e6);color:#fff;font-size:calc(10.5px*var(--fs));line-height:17px;text-align:center;
box-shadow:0 0 8px color-mix(in srgb,var(--ac) 45%,transparent);
font-family:ui-monospace,Consolas,monospace;z-index:2}
.agt .badge.zero{opacity:.28}
@keyframes ping{0%{transform:scale(1)}40%{transform:scale(1.55)}100%{transform:scale(1)}}
.agt .badge.ping{animation:ping .7s cubic-bezier(.2,1.6,.4,1)}
.agt .flash{position:absolute;inset:-9px;border-radius:50%;border:2px solid var(--ac,#38d6e6);opacity:0;pointer-events:none}
@keyframes fire{0%{opacity:.95;transform:scale(.5)}100%{opacity:0;transform:scale(2.1)}}
.agt .flash.fire{animation:fire .9s ease-out}
/* ---------- links ---------- */
.lk{fill:none;stroke-linecap:round;opacity:0;pointer-events:none;transition:opacity .35s ease}
/* R3（10-18 第十五轮）：持久亮线——新消息的链路以 .live 持续显示 LIVE_MS(60s) 或至滑出窗口，
   与粒子动画解耦；到期静默撤。放在 .on/.hl/.lit 之前：悬停高亮与到达闪光仍可覆盖它。 */
.lk.live{opacity:.8;stroke-width:2.1px;filter:drop-shadow(0 0 4px rgba(160,210,255,.45))}
.lk.on{opacity:.62}
.lk.hl{opacity:1;stroke-width:2.6px;filter:drop-shadow(0 0 5px rgba(160,210,255,.65))}
.lk.temp{opacity:.5}
.lk.lit{opacity:1;stroke-width:2.8px!important;transition:opacity .9s linear}
.dot.glow{border-color:var(--ac,#38d6e6);filter:brightness(1.25) saturate(1.15)}
.station .orb.glow{box-shadow:0 0 26px var(--scg,rgba(127,176,255,.5)),0 0 0 2px rgba(255,255,255,.5)}
/* R6（10-17 第十轮）：钉选态按定稿改 1px 同色细描边＋轻微提亮（发光圈废除，全局无阴影） */
.agt.pinned .dot{border-color:var(--ac,#38d6e6);filter:brightness(1.15)}
.station.pinned .ring{opacity:.55}
/* ---------- photon ---------- */
.ph{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;z-index:9;pointer-events:none;
background:radial-gradient(circle,#fff,currentColor 55%,transparent 75%);box-shadow:0 0 12px 3px currentColor}
.ph::before{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;margin:-2.5px;border-radius:50%;
background:currentColor;opacity:.55;box-shadow:0 0 8px 2px currentColor}
/* ---------- group card deck (vertical feather) ---------- */
.dwrap{position:absolute;z-index:20;width:236px}
.dkhit{position:absolute;z-index:0;pointer-events:auto}
.gcard.hot{z-index:99}
.dmore{position:absolute;width:auto;padding:2px 10px;border-radius:10px;font-size:calc(10.5px*var(--fs));color:#9fb4cc;background:rgba(13,20,32,.92);border:1px solid rgba(108,168,255,.35);font-family:ui-monospace,Consolas,monospace;letter-spacing:.05em}
#legend{position:fixed;left:26px;bottom:92px;color:var(--mut);font-size:calc(11px*var(--fs));z-index:6;
letter-spacing:.06em;display:flex;flex-direction:column;gap:5px;max-width:56vw}
.lgrow{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.lgsec{font-size:calc(10px*var(--fs));color:#4f6377;letter-spacing:.16em;margin-right:3px;flex:none}
.lgi{display:inline-flex;align-items:center;gap:6px;cursor:pointer;padding:2px 9px;border-radius:11px;
border:1px solid rgba(108,168,255,.22);background:rgba(9,14,23,.66);color:#a9bcd2;
font-size:calc(10.5px*var(--fs));user-select:none;transition:all .15s}
.lgi:hover{border-color:rgba(56,214,230,.7);color:#fff}
.lgi.off{opacity:.4;text-decoration:line-through}
.dotl{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.station.hid,.agt.hid{display:none!important}
.gcard{position:absolute;left:0;backdrop-filter:blur(8px);width:236px;height:70px;border-radius:10px;padding:7px 9px;cursor:pointer;
background:rgba(11,17,28,.98);
border:1px solid color-mix(in srgb,var(--gc) 50%,rgba(108,168,255,.2));border-left:3px solid var(--gc);
box-shadow:0 0 20px -8px var(--gc),0 6px 18px rgba(0,0,0,.55);transform-origin:8% 90%;
transition:transform .32s cubic-bezier(.2,.8,.25,1),top .32s cubic-bezier(.2,.8,.25,1),box-shadow .2s,filter .2s}
.gcard .r1{display:flex;align-items:center;gap:8px}
.gcard .cdot{width:7px;height:7px;border-radius:2px;background:var(--gc);box-shadow:0 0 6px var(--gc);flex:none}
.gcard .cname{font-size:calc(13px*var(--fs));font-weight:700;color:#e6eefb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .cnum{margin-left:auto;font-size:calc(10.5px*var(--fs));color:var(--gc);font-family:ui-monospace,Consolas,monospace;
border:1px solid var(--gc);border-radius:9px;padding:1px 7px;opacity:.85;flex:none}
.gcard .r2{font-size:calc(10.5px*var(--fs));color:#a9bad0;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .r3{font-size:calc(10px*var(--fs));color:var(--mut);margin-top:3px;font-family:ui-monospace,Consolas,monospace;
display:flex;justify-content:space-between}
.gcard.hot{box-shadow:0 0 0 1.5px var(--gc),0 0 30px -6px var(--gc),0 14px 36px rgba(0,0,0,.75);z-index:99;filter:brightness(1.2)}
.gcard.empty{opacity:.55;pointer-events:none}
/* ---------- message viewer (big card) ---------- */
#mask{position:fixed;inset:0;background:rgba(2,4,8,.72);backdrop-filter:blur(3px);z-index:48;display:none}
/* R17（10-19）：任务流式视图——逐字渲染任务终态结果（WS 通道已有，补 /web 侧）。 */
#stream{position:fixed;right:14px;bottom:104px;width:min(430px,46vw);max-height:46vh;display:flex;flex-direction:column;
background:rgba(9,14,22,.92);border:1px solid var(--edge);border-radius:10px;z-index:47;font-size:calc(12px*var(--fs))}
#st-hd{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--edge)}
#st-hd .t{color:var(--cyan);letter-spacing:.12em}
#st-hd input{flex:1;min-width:0;background:rgba(11,17,27,.7);border:1px solid var(--edge);border-radius:6px;
color:#dce7f5;padding:4px 8px;font-family:ui-monospace,Consolas,monospace}
#st-hd .btn{padding:4px 10px}
#st-hd .s{color:#7f93ad;font-family:ui-monospace,Consolas,monospace}
#st-out{margin:0;padding:10px;overflow:auto;white-space:pre-wrap;word-break:break-word;
color:#cfe0f5;font-family:ui-monospace,Consolas,monospace;line-height:1.55;flex:1}
#st-out .cur{color:var(--cyan)}
#st-out .ok{color:#57e0a0}
#st-out .bad{color:#ff7d8a}
#viewer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.92);z-index:50;
display:none;width:min(920px,92vw);height:min(600px,80vh);background:#0b1320;
border:1.5px solid var(--vc,#38d6e6);border-radius:16px;overflow:hidden;
box-shadow:0 0 44px -8px var(--vc,#38d6e6),0 30px 80px rgba(0,0,0,.8);
transition:transform .28s cubic-bezier(.2,1.3,.4,1)}
#viewer.show{display:flex;transform:translate(-50%,-50%) scale(1)}
#vlist{width:280px;flex:none;border-right:1px solid var(--edge);background:rgba(6,10,17,.6);overflow-y:auto;padding:10px}
#vlist .row{display:flex;gap:8px;align-items:center;padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent;transition:border-color .15s,background .15s}
#vlist .row:hover{background:rgba(108,168,255,.07)}
#vlist .row.on{border-color:var(--vc);background:color-mix(in srgb,var(--vc) 9%,transparent)}
#vlist .row .k{width:8px;height:8px;border-radius:2px;flex:none;box-shadow:0 0 6px var(--kc)}
#vlist .row .t{font-size:calc(10px*var(--fs));color:var(--mut);flex:none;font-family:ui-monospace,Consolas,monospace}
#vlist .row .s{font-size:calc(11px*var(--fs));color:#b7c6d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
/* R8（10-17 第十轮）：完整往来链里每条消息标注发件人 */
#vlist .row .rf{font-size:calc(10px*var(--fs));color:#9fc3ef;flex:none;max-width:78px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:ui-monospace,Consolas,monospace}
#vmain{flex:1;padding:22px 26px 34px;overflow-y:auto;position:relative}
/* R2（10-16 第五轮）：弹窗内滚动条深色定制——细窄圆角，thumb 随话题主题色 */
#vlist,#vmain{scrollbar-width:thin;scrollbar-color:rgba(127,176,255,.32) rgba(255,255,255,.04)}
#vlist::-webkit-scrollbar,#vmain::-webkit-scrollbar{width:9px;height:9px}
#vlist::-webkit-scrollbar-track,#vmain::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:8px}
#vlist::-webkit-scrollbar-thumb,#vmain::-webkit-scrollbar-thumb{border-radius:8px;
background:linear-gradient(180deg,color-mix(in srgb,var(--vc,#38d6e6) 42%,#16233a),color-mix(in srgb,var(--vc,#38d6e6) 22%,#16233a));
border:2px solid transparent;background-clip:content-box}
#vlist::-webkit-scrollbar-thumb:hover,#vmain::-webkit-scrollbar-thumb:hover{
background:linear-gradient(180deg,color-mix(in srgb,var(--vc,#38d6e6) 65%,#1c2b40),color-mix(in srgb,var(--vc,#38d6e6) 40%,#1c2b40));
background-clip:content-box}
/* R2（10-16 第五轮）：上一组/下一组按钮移到弹窗外两侧（fixed，坐标由 posGNav 按窗体矩形贴外缘 12px；
   空间不足才回退内侧贴边）。此前是 #viewer 内部悬浮、遮挡正文被否。 */
.gn{position:fixed;top:50%;z-index:51;width:34px;height:56px;border-radius:10px;
background:rgba(6,10,17,.8);border:1px solid color-mix(in srgb,var(--vc,#38d6e6) 50%,transparent);
color:var(--vc,#38d6e6);font-size:26px;line-height:1;cursor:pointer;padding:0;display:none;
align-items:center;justify-content:center;opacity:.82;transition:opacity .18s,box-shadow .18s,background .18s}
.gn.show{display:flex}
.gn:hover{opacity:1;background:rgba(13,20,32,.94);box-shadow:0 0 16px color-mix(in srgb,var(--vc,#38d6e6) 45%,transparent)}
/* R13（10-17 第十三轮）：弹窗去掉话题标题行（#v-tp 废除）；序列号紧贴路由行上方 */
#v-seq{font-size:calc(11px*var(--fs));color:var(--mut);margin:4px 0 10px;font-family:ui-monospace,Consolas,monospace}
#v-hd{font-size:calc(12.5px*var(--fs));color:#9fb4cc;background:rgba(108,168,255,.06);border:1px dashed var(--edge);
border-left:3px solid var(--vc);border-radius:8px;padding:7px 11px;margin-bottom:12px;
display:flex;align-items:center;gap:12px}
/* R13：路由胶囊行=左侧 A→B 胶囊 + 右侧元信息（原底部 #v-meta 并入，居右排列） */
#v-caps{min-width:0;white-space:nowrap;overflow:hidden}
#v-hmeta{margin-left:auto;display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
color:var(--mut);font-size:calc(11.5px*var(--fs));font-family:ui-monospace,Consolas,monospace}
/* R1（10-17 第八轮）：弹窗路由=对话记录同款双层胶囊（CSS 与 src/api.rs 逐字一致） */
.idc{display:inline-flex;align-items:center;justify-content:flex-end;background:var(--nc,#22344f);border-radius:13px;padding:2px 2px 2px 14px;margin-right:4px;vertical-align:middle;max-width:100%}
.idc .idci{display:inline-block;border-radius:999px;padding:0 9px;font-weight:600;font-size:12px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px;vertical-align:middle}
/* R6（10-17 第十轮）：弹窗胶囊 hover 微动效与对话记录一致（cap-nudge keyframes 见上方 .agt 区，与 api.rs 逐字同源） */
.idc:hover .idci{animation:cap-nudge .7s cubic-bezier(.34,1.2,.64,1) 1}
@media (prefers-reduced-motion:reduce){.idc:hover .idci{animation:none}}
.idn{opacity:.62;font-size:11px;margin-right:2px}
.varr{opacity:.6;font-size:12px;padding:0 4px}
#v-body{font-size:calc(14px*var(--fs));line-height:1.75;color:#eaf2fb;white-space:pre-wrap;word-break:break-all}
#v-kind{border:1px solid var(--vc);color:var(--vc);border-radius:9px;padding:1px 9px}
#v-x{position:absolute;top:10px;right:12px;font-size:calc(12px*var(--fs));color:var(--mut);cursor:pointer;z-index:2;padding:3px 10px;border:1px solid rgba(140,170,200,.35);border-radius:7px}
#v-x:hover{color:#fff}
#viewer .hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:calc(10px*var(--fs));color:#3f5065;letter-spacing:.18em;pointer-events:none}
/* ---------- bottom bar ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:22px;padding:0 26px;z-index:30;
background:linear-gradient(0deg,rgba(4,7,13,.85),transparent)}
#bar .lbl{font-size:calc(11px*var(--fs));color:var(--mut);letter-spacing:.18em;white-space:nowrap}
#win{-webkit-appearance:none;appearance:none;width:220px;height:3px;border-radius:2px;background:#1b2a40;outline:none;cursor:pointer}
#win::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:var(--cyan);
box-shadow:0 0 12px var(--cyan);cursor:pointer}
#winv{font-size:calc(12px*var(--fs));color:var(--cyan);font-family:ui-monospace,Consolas,monospace;width:52px}
/* R12（10-17 第十二轮）：实时按钮、时段弹出面板、时间区间文本全部废除——星图只提供实时视图 */
#bar .btns{margin-left:auto;display:flex;gap:10px}
.btn{font-size:calc(12px*var(--fs));color:#a9bcd2;border:1px solid var(--edge);border-radius:8px;padding:6px 14px;cursor:pointer;
background:rgba(11,17,27,.7);letter-spacing:.12em;transition:all .18s}
.btn:hover{color:#fff;border-color:var(--cyan);box-shadow:0 0 14px rgba(56,214,230,.3)}
.btn.on{color:var(--cyan);border-color:var(--cyan)}
</style>
</head>
<body>
<div id="scan"></div>
<div id="viewport"><div id="starfield"></div><div id="world">
  <div id="stage" data-page="starmap">
    <svg id="map"></svg>
  </div>
</div></div>
<div id="topbar">
  <div id="brand"><h1>AGENT<em>LINK</em> · 消息星图</h1></div>
  <div id="hud"></div>
</div>
<div id="bar">
  <span class="lbl">窗口长度</span><input id="win" type="range" min="60" max="3600" step="60" value="600"><span id="winv">10min</span>
  <div class="btns">
    <div class="btn" id="bReset">复位</div>
    <div class="btn" id="bPause">流入</div>
    <div class="btn" id="bSnap">截图</div>
    <div class="btn" id="bRec">录屏</div>
    <div class="btn" id="bFs">全屏</div>
  </div>
</div>
<div id="mask"></div>
<div id="stream" data-al-stream="panel">
  <div id="st-hd">
    <span class="t">任务流式视图</span>
    <input id="st-tid" placeholder="task_id" autocomplete="off">
    <button type="button" id="st-sub" class="btn">订阅</button>
    <button type="button" id="st-clr" class="btn">清空</button>
    <span id="st-st" class="s">待命</span>
  </div>
  <pre id="st-out" data-al-stream="out"></pre>
</div>
<div id="legend"></div>
<div id="viewer">
  <div id="vlist"></div>
  <div id="vmain">
   <span id="v-x">关闭</span>
   <div id="v-seq"></div>
   <div id="v-hd"><span id="v-caps"></span><span id="v-hmeta"><span id="v-time"></span><span id="v-kind"></span></span></div>
   <div id="v-body"></div>
  </div>
  <div class="hint">点条目 / 滚轮 / ← → 翻页 · Shift+← → 换组 · ESC 关闭</div>
</div>
<button type="button" class="gn" id="gPrev" title="上一组话题（Shift+←）">‹</button>
<button type="button" class="gn" id="gNext" title="下一组话题（Shift+→）">›</button>
<script>

const stageEl=document.getElementById("stage"),map=document.getElementById("map"),
hud=document.getElementById("hud");
let W=0,H=0;{const vr0=stageEl.getBoundingClientRect();W=vr0.width||innerWidth;H=vr0.height||innerHeight;}
/* R2（10-17 第十轮）：偏左根因=W/H 在解析时取 innerWidth，iframe 首帧尺寸未定即全量落位错，
   且 resize 缺 W0=0 时 rx=Infinity 打坏坐标。改为一律以 stage 实际 rect 为准，poll 开头 syncDims 对表自愈。 */
const CUR={x:innerWidth/2,y:innerHeight/2};
addEventListener("pointermove",e=>{CUR.x=e.clientX;CUR.y=e.clientY},{passive:true});
function barH(){const b=document.getElementById("bar");return b?b.offsetHeight:56}
// R5（10-16 第五轮）：节点圆缩小后，胶囊轨道同步收档（46–66 → 40–56）
function orbR(){return Math.max(40,Math.min(56,(H-barH()-84)/7.2))}
function staClamp(){const top=90,bot=Math.max(top+60,H-barH()-orbR()-30);return{top,bot}}
const MACH={};let SELF=null,NODES=[],NAMES={},COLORS={},ST_ON=0,ST_ALL=0,AG_ALL=0;
/* R6（10-16 第三轮）：图例点选显隐。hideNodes 按 node_id、hideAgt 按 agent_id 全局（与 R1 全局同色语义一致）；
   统一在 activeMsgs 出口过滤 → 站台、卫星、卡组、徽章、HUD 一个口径，隐藏即整体从画面消失。localStorage 持久化。 */
const hideNodes=new Set(),hideAgt=new Set();
try{const _sh=JSON.parse(localStorage.getItem("starhide")||"{}");for(const x of(_sh.n||[]))hideNodes.add(x);for(const x of(_sh.a||[]))hideAgt.add(x);}catch(e){}
function saveHide(){try{localStorage.setItem("starhide",JSON.stringify({n:[...hideNodes],a:[...hideAgt]}))}catch(e){}}
function epHid(k){if(!k)return false;const i=k.indexOf("|");const m=k.slice(0,i),a=k.slice(i+1);
 return hideNodes.has(m)||(a!=="@node"&&hideAgt.has(a));}
/* R1（10-16 第五轮）：幽灵白名单——节点=本机∪/v1/peers，agent=/v1/fleet/agents 注册表。
   历史里出现过的已消失 id 不再建站；指向幽灵端点的消息与 epHid 同口径在出口统一过滤
   （HUD/徽章/卡组/弹窗/粒子一个口径，满足"宁可少显示不能显示错"）。 */
const LIVE_N=new Set(),LIVE_A=new Map();
function ghost(k){if(!k)return true;const i=k.indexOf("|");const n=k.slice(0,i),a=k.slice(i+1);
 return !LIVE_N.has(n)||(a!=="@node"&&!(LIVE_A.get(n)||new Set()).has(a));}
function esc(s){return String(s==null?"":s).replace(/[&<"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function fm32(x){x^=x>>>16;x=Math.imul(x,0x85ebca6b);x^=x>>>13;x=Math.imul(x,0xc2b2ae35);x^=x>>>16;return x>>>0}
// 节点配色：按 node_id 哈希固定（改名/刷新不漂移）；深档 nodeCol=胶囊包边，亮档 staCol=站台展示
function nodeHue(n){return fnv("N|"+String(n))%360}
function nodeCol(n){return COLORS["node:"+n]||("hsl("+nodeHue(n)+",46%,30%)")}
function staCol(n){return COLORS["node:"+n]||("hsl("+nodeHue(n)+",58%,66%)")}
function staGlow(n){return COLORS["node:"+n]?COLORS["node:"+n]+"88":("hsla("+nodeHue(n)+",58%,64%,.5)")}
// agent 卫星/胶囊色（10-16 第三轮 R1）：全部通道只由 agent_id 哈希派生——同 id 全网同色；
// S/L 扰动位让不同 id 撞同色相时仍可区分。与 src/api.rs 必须逐字一致。
function agHue(a){return fm32(fnv("|uo"+String(a)))%360}
function agSat(a){return 46+(fm32(fnv("S|"+String(a)))%28)}
function agLit(a){return 56+(fm32(fnv("L|"+String(a)))%24)}
function agCol(n,a){return COLORS["agent:"+n+"|"+a]||("hsl("+agHue(a)+","+agSat(a)+"%,"+agLit(a)+"%)")}
function agGlow(n,a){return COLORS["agent:"+n+"|"+a]?COLORS["agent:"+n+"|"+a]+"99":("hsla("+agHue(a)+","+(agSat(a)+8)+"%,"+(agLit(a)-14)+"%,.6)")}
function colFor(nid,a){return a?agCol(nid,a):staCol(nid)}
// 手选色可能是深 hex——按亮度给胶囊内文字配可读前景（与 api.rs onCol 逐字一致）
function onCol(c){if(typeof c==="string"&&c[0]==="#"&&c.length===7){const r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);return (0.299*r+0.587*g+0.114*b)>150?"#0b1420":"#eef4fb";}return "#0b1420";}
// 实体键 "<node>|<agent|@node>" → 双层胶囊（10-17 第八轮 R1：与对话记录 chip() 同构）
function capHtml(k){const i=k.indexOf("|");const n=k.slice(0,i);const a=k.slice(i+1);
 if(a==="@node")return `<span style="color:${staCol(n)}" title="${esc(n)}">●</span><span class="idn">${esc(nmOf(n))}</span>`;
 const c=agCol(n,a);
 return `<span class="idc" style="--nc:${nodeCol(n)}" title="${esc(n)} / ${esc(a)}"><span class="idci" style="background:${c};color:${onCol(c)}">${esc(a)}</span></span><span class="idn" style="color:${staCol(n)};opacity:.85" title="${esc(n)}">${esc(nmOf(n))}</span>`;}
function routeHtml(m){return capHtml(m.f)+'<span class="varr">→</span>'+capHtml(m.to);}
function who(nid){return NAMES[nid]||nid;}
function nmOf(nid){return (MACH[nid]&&MACH[nid].lab)||who(nid)}
const T=(id,name,color,msgs)=>({id,name,color,msgs});
const M=(t,f,to,body,kind="msg")=>({t,f:a2k(f),to:a2k(to),body,kind});
function a2k([m,a]){return m+"|"+a}
let TOPICS=[];
/* ---------- positions (draggable) ---------- */
const STA={},AGTP={}; /* AGTP[key]={dx,dy} offset from station center */
const AGP={};         /* 用户手动拖过的胶囊：initPos 重排时保留其位 */
function initPos(){const cl=staClamp(),r=orbR()+44;for(const m in MACH){const c=MACH[m];if(!STA[m])STA[m]={x:c.x*W,y:Math.max(cl.top,Math.min(cl.bot,c.y*H))};
 c.agents.forEach((a,i)=>{const k=a2k([m,a]);if(AGP[k])return;
  const ang=Math.PI/2+i*(2*Math.PI/Math.max(c.agents.length,3));
  AGTP[k]={dx:Math.cos(ang)*r,dy:Math.sin(ang)*r};});
 if(!AGTP[a2k([m,"@node"])])AGTP[a2k([m,"@node"])]={dx:0,dy:0};}}
/* R14-A（10-17 第十四轮）：agPos 出口叠加 AVO 临时避让偏移（不写 AGTP/AGP/STA，不持久化）。 */
function agPos(k){const[m]=k.split("|");const s=STA[m],o=AGTP[k],v=AVO[k];return{x:s.x+o.dx+(v?v.x:0),y:s.y+o.dy+(v?v.y:0)};}
/* ---------- time window ---------- */
let winS=600;const T0=Date.now();
/* R12（10-17 第十二轮）：时段模式废除——时间窗恒为跟随现在的滑窗（[now-winS, now]），窗口长度最大 1 小时。 */
function wBounds(){return [Date.now()-winS*1000,Date.now()];}
function activeMsgs(){const out=[],now=Date.now(),b=wBounds();for(const tp of TOPICS)for(const msg of tp.msgs){msg.t=-Math.round((now-msg.abs)/1000);if(msg.abs>=b[0]&&msg.abs<=b[1]&&!epHid(msg.f)&&!epHid(msg.to)&&!ghost(msg.f)&&!ghost(msg.to))out.push({...msg,tp});}return out;}
function hashK(s){let h=17;for(const c of s)h=Math.imul(h^c.charCodeAt(0),2654435761);return Math.abs(h);}
function qp(p1,p2,bow,u){const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.hypot(dx,dy)||1;
 const qx=mx+(-dy/L)*bow,qy=my+(dx/L)*bow,it=1-u;
 return{x:it*it*p1.x+2*it*u*qx+u*u*p2.x,y:it*it*p1.y+2*it*u*qy+u*u*p2.y};}
function chanD(p1,p2,bow){const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2,dx=p2.x-p1.x,dy=p2.y-p1.y,L=Math.hypot(dx,dy)||1;
 return`M ${p1.x} ${p1.y} Q ${mx+(-dy/L)*bow} ${my+(dx/L)*bow} ${p2.x} ${p2.y}`;}
function bowOf(k){return 34+(hashK(k)%26);}
/* ---------- stations & agents dom ---------- */
const staEl={},agtEl={};
function shortNm(lab,m){const s=String(lab||"").trim();if(!s)return m===SELF?"本机":"节点";if(s.length<=4)return s;if(s.length<=7)return `<span style="font-size:calc(6.5px*var(--fs));letter-spacing:.02em">${esc(s)}</span>`;return esc(s.slice(0,4))+"…";}
function buildWorld(){
 for(const m in MACH){const c=MACH[m];const d=document.createElement("div");d.className="station";
 d.style.setProperty("--sc",c.col);d.style.setProperty("--scg",staGlow(m));
 d.innerHTML=`<div class="ring"></div><div class="pulse"></div><div class="orb"></div><div class="glyph"><span>${shortNm(c.lab,m)}</span></div><div class="lab"><i>${esc(c.ip)}</i></div>`;
 d.dataset.m=m;stageEl.appendChild(d);staEl[m]=d;
 d.addEventListener("pointerdown",e=>startDrag(e,"station",m));}
 for(const m in MACH){const k=a2k([m,"@node"]);
  const w2=document.createElement("div");w2.className="dwrap";stageEl.appendChild(w2);dwraps[k]=w2;
  const st=staEl[m];
  st.addEventListener("pointerenter",()=>{hovSta=m;reveal(k);applyLanes();});
  st.addEventListener("pointerleave",()=>scheduleHide(k));
  w2.addEventListener("pointerenter",()=>{hovSta=m;cancelTomb(k);if(opentomb[k]){clearTimeout(opentomb[k]);opentomb[k]=null;}setDeckOpen(k,true);applyLanes();});
  w2.addEventListener("pointerleave",()=>{clearOpenTomb(k);opentomb[k]=setTimeout(()=>{opentomb[k]=null;setDeckOpen(k,false);scheduleHide(k);},140);});}
 for(const m in MACH)for(const a of MACH[m].agents){const k=a2k([m,a]);
 const d=document.createElement("div");d.className="agt";d.style.setProperty("--ac",agCol(m,a));
 d.style.setProperty("--acg",agGlow(m,a));d.style.setProperty("--acn",nodeCol(m));
 d.innerHTML=`<div class="dot"><span class="in" style="color:${onCol(agCol(m,a))}">${esc(a)}</span></div><div class="flash"></div><div class="badge">0</div>`;
 stageEl.appendChild(d);agtEl[k]=d;
 d.addEventListener("pointerdown",e=>startDrag(e,"agent",k));
 d.addEventListener("pointerenter",()=>{hovAgt=k;reveal(k);applyLanes();});
 d.addEventListener("pointerleave",()=>scheduleHide(k));
 const w=document.createElement("div");w.className="dwrap";stageEl.appendChild(w);dwraps[k]=w;
 w.addEventListener("pointerenter",()=>{hovAgt=k;cancelTomb(k);if(opentomb[k]){clearTimeout(opentomb[k]);opentomb[k]=null;}setDeckOpen(k,true);applyLanes();});
 w.addEventListener("pointerleave",()=>{clearOpenTomb(k);opentomb[k]=setTimeout(()=>{opentomb[k]=null;setDeckOpen(k,false);scheduleHide(k);},140);});}}
function placeWorld(){
 for(const m in MACH){const s=STA[m];staEl[m].style.left=s.x+"px";staEl[m].style.top=s.y+"px";}
 for(const k in agtEl){const p=agPos(k);const e=agtEl[k];e.style.left=p.x+"px";e.style.top=p.y+"px";}}
/* R14-A（10-17 第十四轮）：拖动避让——AVO 临时偏移层（stage 像素），agPos 出口叠加，
   连线/粒子/卡组经 agPos 自动跟随；AVOT 为目标偏移，rAF 滑移动画，松手清零后回位。 */
const AVO={},AVOT={},AGSZ={};
function pillSize(k){const e=agtEl[k];if(!e)return{w:90,h:18};
 if(!AGSZ[k]){const d=e.querySelector(".dot");AGSZ[k]={w:(d&&d.offsetWidth)||90,h:(d&&d.offsetHeight)||18};}return AGSZ[k];}
function agBase(k){const[m]=k.split("|");const s=STA[m],o=AGTP[k];return{x:s.x+o.dx,y:s.y+o.dy};}
function avoidTargets(){ /* 被拖胶囊为唯一斥力源：其余胶囊沿中心连线推出到矩形不相交（外扩 6px），单枚上限 120px */
 if(!drag||drag.kind==="station")return;
 const P=agPos(drag.id),sP=pillSize(drag.id);
 for(const k in agtEl){
  if(k===drag.id){delete AVOT[k];continue;}
  const B=agBase(k),sQ=pillSize(k);
  const dx=B.x-P.x,dy=B.y-P.y,L=Math.hypot(dx,dy);
  const needX=sP.w/2+sQ.w/2+10,needY=sP.h/2+sQ.h/2+10;/* R14-A：留 10px 外扩（恰好贴边解在渲染舍入后仍会被判叠，实测已验） */
  let t=0;
  if(Math.abs(dx)<needX&&Math.abs(dy)<needY){ /* 两矩形（含外扩）相交才避让 */
   const ux=L?dx/L:0,uy=L?dy/L:-1; /* 中心重合：向上推 */
   let tx=Infinity,ty=Infinity;
   if(Math.abs(ux)>1e-3)tx=(needX-Math.abs(dx))/Math.abs(ux);
   if(Math.abs(uy)>1e-3)ty=(needY-Math.abs(dy))/Math.abs(uy);
   t=Math.min(120,Math.max(tx,ty));if(!isFinite(t))t=120;}
  AVOT[k]={x:(L?dx/L:0)*t,y:(L?dy/L:(dx?0:-1))*t};
 }}
let avRaf=null;
function avTick(){
 let busy=false;
 for(const k in AVO){const tv=AVOT[k]||{x:0,y:0},v=AVO[k];
  v.x+=(tv.x-v.x)*0.3;v.y+=(tv.y-v.y)*0.3;
  if(Math.abs(tv.x-v.x)<0.3&&Math.abs(tv.y-v.y)<0.3){v.x=tv.x;v.y=tv.y;
   if(tv.x===0&&tv.y===0)delete AVO[k];}else busy=true;}
 for(const k in AVOT){if(!AVO[k]){const tv=AVOT[k];if(tv.x===0&&tv.y===0){delete AVOT[k];continue;}
  AVO[k]={x:0,y:0};}}
 placeWorld();renderLinks();for(const k in dwraps)posDwrap(k);
 avRaf=busy?requestAnimationFrame(avTick):null;}
function avKick(){if(avRaf===null)avRaf=requestAnimationFrame(avTick);}
/* R14-A（10-17 第十四轮）：拖动中瞬时到位（滑移追不上快拖会残留叠帧，实测 CDP 路径验证）；滑移只用于松手回位。 */
function avSnap(){for(const k in AVO){const t=AVOT[k];if(!t||(t.x===0&&t.y===0))delete AVO[k];else{const v=AVO[k];v.x=t.x;v.y=t.y;}}
 for(const k in AVOT){const t=AVOT[k];if(t&&(t.x!==0||t.y!==0)&&!AVO[k])AVO[k]={x:t.x,y:t.y};}}
function avoidClear(){for(const o of[AVO,AVOT,AGSZ])for(const k in o)delete o[k];}
/* ---------- drag ---------- */
let drag=null;
function startDrag(e,kind,id){
 e.preventDefault();
 const base=kind==="station"?{sx:STA[id].x,sy:STA[id].y}:{sx:AGTP[id].dx,sy:AGTP[id].dy};
 drag={kind,id,ox:e.clientX,oy:e.clientY,moved:false,...base};
 if(kind!=="station")drag.r=Math.hypot(AGTP[id].dx,AGTP[id].dy)||orbR();
 (kind==="station"?staEl[id]:agtEl[id]).classList.add("drag");}
addEventListener("pointermove",e=>{
 if(!drag)return;const dx=e.clientX-drag.ox,dy=e.clientY-drag.oy;
 if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
 if(!drag.moved)return;
 if(drag.kind==="station"){const s=STA[drag.id];
  s.x=Math.max(110,Math.min(W-110,drag.sx+dx));const cl=staClamp();s.y=Math.max(cl.top,Math.min(cl.bot,drag.sy+dy));
 }else{const o=AGTP[drag.id];const st=STA[drag.id.split("|")[0]];
  const ang=Math.atan2(e.clientY-st.y,e.clientX-st.x);
  o.dx=Math.cos(ang)*drag.r;o.dy=Math.sin(ang)*drag.r;
  avoidTargets();avSnap();}
 placeWorld();renderLinks();for(const k in dwraps)posDwrap(k);});
addEventListener("pointerup",()=>{
 if(drag){const kind=drag.kind,id=drag.id,moved=drag.moved;
  if(kind==="station")staEl[id].classList.remove("drag");else agtEl[id].classList.remove("drag");
  drag=null;
  /* R14-A（10-17 第十四轮）：拖拽结束清目标偏移，avTick 把被避让者滑回原位（station 拖拽不受影响）。 */
  if(kind==="agent"){for(const k in AVOT)delete AVOT[k];avKick();}
  if(moved&&kind!=="station")AGP[id]=1;
  if(!moved){const t=kind==="station"?"sta":"agt",was=pinC&&pinC.t===t&&pinC.k===id;
   clearPin();
   if(!was){pinC={t,k:id};(kind==="station"?staEl[id]:agtEl[id]).classList.add("pinned");applyLanes();}}}});
stageEl.addEventListener("pointerup",e=>{if(pinC&&!e.target.closest(".agt,.station,.dwrap"))clearPin();});
/* ---------- links ---------- */
let LINKS=[];
function renderLinks(){
 LINKS=[];const seen=new Set();
 for(const m of activeMsgs()){const key=m.f+"=>"+m.to+"#"+m.tp.id;
  if(seen.has(key))continue;seen.add(key);
  LINKS.push({key,f:m.f,t:m.to,color:m.tp.color,first:m});}
 /* R-fix（10-17）：innerHTML 全量替换会顺手抹掉飞行中粒子的 temp 连线——poke 400ms 快轮询
    正好发生在 1.7s 飞行窗口内，线被抹、粒子裸飞、到达又整体重建，用户看不见连线。
    保留尚未被永久线集合覆盖的 temp 线（同一 key 已有永久线则丢弃旧的，避免叠线）。 */
 const temps=[...map.querySelectorAll(".lk.temp")].filter(t=>!seen.has(t.getAttribute("data-k")));
 map.innerHTML=LINKS.map(l=>{const p1=agPos(l.f),p2=agPos(l.t);
  return`<path class="lk" data-k="${l.key}" d="${chanD(p1,p2,bowOf(l.key))}" stroke="${l.color}" stroke-width="1.5"/>`;}).join("");
 for(const t of temps)map.appendChild(t);
 /* 飞行中的线在整体重建后须连续点亮（旧永久线节点被替换、闭包里的 ln 已脱离 DOM）：
    把飞行实体重新绑到新节点并补 lit，避免"线亮→中途暗一截→到达才重新亮"的闪烁。 */
 for(const e of liveAnims){if(!e.ln||e.ln.parentNode!==map){
  const n=map.querySelector(`[data-k="${CSS.escape(e.key)}"]`);
  if(n){e.rebind(n);n.classList.add("lit");}}}
 paintLive(); /* R3：innerHTML 全量重建后给在期新消息链路补回 .live */
 applyLanes();renderBadges();renderHud();}

let capSeq=0,capBusy=false,capRec=null,capTimer=null,capFrames=0,capPaused=[];
const capcv=document.createElement("canvas");let capctx=capcv.getContext("2d");
function bakeForm(el){if(el.tagName==="INPUT"){if(el.type==="checkbox"||el.type==="radio"){if(el.checked)el.setAttribute("checked","")}else el.setAttribute("value",el.value)}
 else if(el.tagName==="TEXTAREA")el.textContent=el.value;
 else if(el.tagName==="SELECT"){const o=el.options[el.selectedIndex];el.innerHTML="";if(o){const s=document.createElement("span");s.textContent=o.textContent;el.appendChild(s)}}}
function rootVarsCss(){let t="";const cs=getComputedStyle(document.documentElement);
 for(const k of cs){if(k.startsWith("--")){const v=cs.getPropertyValue(k).trim();if(v)t+=k+":"+v+";"}}return t}
async function captureImg(dw,dh){
const cap=String(++capSeq);
const live=document.documentElement;
const els=live.querySelectorAll("*");
const clone=live.cloneNode(true);
// 定格流程：先算出带 CSS 动画的真页面元素下标，再把 data-anim-cap 标记同步打到
// 克隆树的同下标元素（cels 在删 script 前取，与 els 一一同构）。全程同步执行，真页面
// 不留痕迹；克隆带标记进序列化，注入的 paused 规则只命中带标记元素。
const animByEl=new Map();const idxMarked=[];
for(let i=0;i<els.length;i++){const an=els[i].getAnimations&&els[i].getAnimations();
 if(an&&an.length){animByEl.set(els[i],an[0]);idxMarked.push(i)}}
const cels=Array.from(clone.querySelectorAll("*")); // 删 script 前先取：与 els 同下标同构
for(const n of Array.from(clone.querySelectorAll("script,link,iframe,base")))n.remove();
for(const i of idxMarked){if(cels[i])cels[i].setAttribute("data-anim-cap",cap)}
clone.setAttribute("data-anim-root",cap);
clone.style.cssText=rootVarsCss()+";margin:0;width:"+dw+"px;height:"+dh+"px;background:#04070d";
for(const b of clone.querySelectorAll("body"))b.style.cssText+=";margin:0;width:"+dw+"px;height:"+dh+"px;overflow:hidden;background:#04070d";
// 动画定格：冻结点 = 墙钟 − startTime（动画被 pause 后 currentTime 仍随墙钟走，不能直接取 currentTime），
// 负 animation-delay 写进克隆元素的内联样式；注入规则统一 paused。
const cmarked=Array.from(clone.querySelectorAll("[data-anim-cap]"));
for(let j=0;j<cmarked.length;j++){const an=animByEl.get(els[idxMarked[j]]);if(!an)continue;
 let ct=Number(an.currentTime);
 if(!isFinite(ct)){const st=Number(an.startTime);ct=isFinite(st)?(document.timeline.currentTime||0)-st:0}
 if(!isFinite(ct))ct=0;
 cmarked[j].style.animationDelay=(-ct/1000)+"s"}
if(idxMarked.length){const fr=document.createElement("style");
 fr.textContent=`[data-anim-root="${cap}"] [data-anim-cap="${cap}"]{animation-play-state:paused!important}`;
 clone.appendChild(fr)}
 for(const st of Array.from(document.querySelectorAll("style"))){const st2=document.createElement("style");
  st2.textContent=st.textContent.replace(/backdrop-filter\s*:[^;}]+/g,"none");clone.appendChild(st2)}
 const srcCvs=live.querySelectorAll("canvas"),dstCvs=clone.querySelectorAll("canvas");
 for(let i=0;i<dstCvs.length;i++){const s=srcCvs[i];if(!s)continue;const r=s.getBoundingClientRect();
  let url="";try{url=s.toDataURL("image/png")}catch(e){}
  const im=clone.createElement("img");if(url)im.src=url;
  im.setAttribute("style","position:fixed;left:"+r.left+"px;top:"+r.top+"px;width:"+r.width+"px;height:"+r.height+"px");
  dstCvs[i].replaceWith(im)}
 for(const el of clone.querySelectorAll("input,textarea,select"))bakeForm(el);
 const xml=new XMLSerializer().serializeToString(clone);
 const body=/<html(\s[^>]*)?>/.test(xml)?xml.replace(/<html(\s[^>]*)?>/,m=>/xmlns=/.test(m)?m:m.replace("<html",'<html xmlns="http://www.w3.org/1999/xhtml"')):"<html>"+xml+"</html>";
 const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+dw+'" height="'+dh+'" viewBox="0 0 '+dw+' '+dh+'"><foreignObject x="0" y="0" width="100%" height="100%">'+body+"</foreignObject></svg>";
 // 注意：本引擎系（含 Chrome 新版）会把 blob: URL 的 SVG 图判为跨源、画进 canvas 即中毒，
 // toBlob/toDataURL 报 SecurityError；data: URL 载体不受影响。必须走 data URL。
 try{const img=new Image();img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);await img.decode();return img}
 catch(e){throw new Error("画面解码失败："+(e&&e.message||e))}}
function capDims(){return[Math.max(2,stageEl.clientWidth||innerWidth),Math.max(2,stageEl.clientHeight||innerHeight)]}
async function capPauseAll(){for(const a of document.getAnimations()){try{if(a.play)a.pause()}catch(e){}}}
function capResumeAll(){for(const a of capPaused){try{a.play()}catch(e){}}capPaused=[]}
async function capFrame(){if(capBusy)return;capBusy=true;
 try{const d=capDims();const img=await captureImg(d[0],d[1]);
  const cw=Math.round(d[0]*devicePixelRatio),chh=Math.round(d[1]*devicePixelRatio);
  if(capcv.width!==cw||capcv.height!==chh){capcv.width=cw;capcv.height=chh;capctx=capcv.getContext("2d")}
  capctx.drawImage(img,0,0,cw,chh)}
 finally{capBusy=false}}
async function capShot(){if(capBusy){setErr("录制进行中，请先停止录屏再截图");return}
 const d=capDims();const img=await captureImg(d[0],d[1]);
 const cv=document.createElement("canvas");cv.width=d[0]*2;cv.height=d[1]*2;
 cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
 const blob=await new Promise(res=>cv.toBlob(res,"image/png"));
 if(!blob){setErr("截图生成失败");return}
 const a=document.createElement("a");a.download="agentlink-star-"+Date.now()+".png";
 a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),8000);setErr("")}
function capMime(){if(typeof MediaRecorder==="undefined"||!MediaRecorder.isTypeSupported)return"";
 for(const m of["video/webm;codecs=vp9","video/webm;codecs=vp8","video/webm"])
  if(MediaRecorder.isTypeSupported(m))return m;return""}
function capRecStop(){if(capTimer){clearInterval(capTimer);capTimer=null}
 const rs=capRec;capRec=null;capFrames=0;capResumeAll();
 const btn=document.getElementById("bRec");btn.classList.remove("on");btn.textContent="录屏";
 if(rs&&rs.state!=="inactive"){try{rs.stop()}catch(e){}}}
document.getElementById("bRec").onclick=async e=>{const btn=e.currentTarget;
 if(capRec){capRecStop();return}
 if(capBusy)return;
 await capPauseAll();
 try{await capFrame()}catch(err){capResumeAll();setErr("录屏启动失败："+(err&&err.message||err));return}
 capPaused=Array.from(document.getAnimations());for(const a of capPaused){try{if(a.play)a.pause()}catch(e){}}
 let stream=null;try{stream=capcv.captureStream(15)}catch(err){capResumeAll();setErr(String(err.message||err));return}
 const mime=capMime();let rec=null;try{rec=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream)}
 catch(err){capResumeAll();setErr(String(err.message||err));return}
 const chunks=[];
 rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};
 rec.onstop=()=>{const a=document.createElement("a");a.download="agentlink-star-"+Date.now()+".webm";
  a.href=URL.createObjectURL(new Blob(chunks,{type:"video/webm"}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),8000)};
 capRec=rec;capFrames=0;try{rec.start(1000)}catch(err){capRec=null;capResumeAll();setErr(String(err.message||err));return}
 btn.classList.add("on");btn.textContent="停止";setErr("");
 capTimer=setInterval(()=>{if(!capRec)return;
  if(++capFrames>450){capRecStop();return} // 450 帧 ≈ 30s 硬上限
  capFrame().catch(()=>{})},66)};
/* ---------- boot ---------- */
let W0=0,H0=0;
/* R2（10-17 第十轮）：偏左根因=解析时 innerWidth 可能是 iframe 首帧(300x150)或隐藏态(0)，
   全量按错尺寸落位；且 W0=0 时 rx=Infinity 把 STA 打坏，只能整页重载。
   改法：一律以 stage 实际 rect 计量；上一尺寸为 0/非有限时不再缩放，改按 MACH 分数坐标重建
   （reAnchor，保留用户拖过的胶囊）；每轮 poll 开头 sizeUp() 对表——resize 事件缺失也 5s 内自愈。 */
function viewport(){const r=stageEl.getBoundingClientRect();return[r.width||innerWidth,r.height||innerHeight];}
function reAnchor(){const cl=staClamp(),r=orbR()+44;for(const m in MACH){const c=MACH[m];
 STA[m]={x:c.x*W,y:Math.max(cl.top,Math.min(cl.bot,c.y*H))};
 c.agents.forEach((a,i)=>{const k=a2k([m,a]);if(AGP[k])return;
  const ang=Math.PI/2+i*(2*Math.PI/Math.max(c.agents.length,3));
  AGTP[k]={dx:Math.cos(ang)*r,dy:Math.sin(ang)*r};});
 if(!AGTP[a2k([m,"@node"])])AGTP[a2k([m,"@node"])]={dx:0,dy:0};}}
function sizeUp(){const vp=viewport(),nw=vp[0],nh=vp[1];
 if(!Object.keys(STA).length){W=nw;H=nh;W0=nw;H0=nh;return;}
 if(nw===W0&&nh===H0&&W0>0&&H0>0)return;
 const bad=!W0||!H0||!isFinite(nw/W0)||!isFinite(nh/H0);
 const rx=nw/(W0||1),ry=nh/(H0||1);W=nw;H=nh;W0=nw;H0=nh;
 if(bad)reAnchor();
 else{for(const m in STA){STA[m].x*=rx;STA[m].y*=ry;}
  const cl=staClamp(),r=orbR();
  for(const m in STA)STA[m].y=Math.max(cl.top,Math.min(cl.bot,STA[m].y));
  for(const k in AGTP){const mag=Math.hypot(AGTP[k].dx,AGTP[k].dy)||1;AGTP[k].dx*=r/mag;AGTP[k].dy*=r/mag;}}
 placeWorld();renderLinks();renderAllDecks();}
function buildStars(){const sf=document.getElementById("starfield");
 for(let i=0;i<110;i++){const t=document.createElement("i");const sz=1+Math.random()*1.8;
  t.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;--d:${(2+Math.random()*4).toFixed(1)}s;animation-delay:${(-Math.random()*5).toFixed(1)}s`;sf.appendChild(t);}}
async function boot(){buildStars();await poll();}
addEventListener("resize",sizeUp);
addEventListener("resize",posGNav); /* R2：窗口尺寸变了，‹ › 的外贴坐标要重算（世界布局由 sizeUp 与下轮 poll 处理） */
/* R1（10-17 第十轮）：实时通道——/v1/ws 不带 client 即观察者连接（服务端本轮起放行本机全部
   事件，含定向消息），任一事件 400ms 合并触发一次 poll；断线指数退避 2s→30s 重连；
   5s 兜底轮询保留：WS 不可用时退回"轮询5s"（HUD 推送灯可见状态）。主控制台发信成功或点
   「刷新」会 postMessage {al:'poke'}，出站单播也秒级上屏。手工时段模式下动画冻结、数据照常刷新。 */
/* AL-STREAM-BEGIN —— 任务流式视图纯逻辑（可被 node 提取做单测；勿改名） */
function alStreamInit(tid){return {tid:tid||"",seq:null,topic:"",lines:[],buf:"",shown:"",done:false,failed:false};}
function alStreamResultText(result){
 if(result==null)return "";
 if(typeof result==="string")return result;
 try{return JSON.stringify(result);}catch(e){return String(result);}
}
function alStreamReduce(state,env){
 const p=(env&&env.payload)||{},tid=p.task_id||"";
 if(!state||!tid||tid!==state.tid||!p.topic)return {state:state,changed:false};
 if(p.seq!=null&&state.seq!=null&&p.seq<=state.seq)return {state:state,changed:false};
 const st=Object.assign({},state,{lines:state.lines.slice()});
 if(p.seq!=null)st.seq=p.seq;
 st.topic=p.topic;
 if(p.topic==="task_accepted")st.lines.push("✓ 已认领");
 else if(p.topic==="task_progress")st.lines.push("· "+(p.stage||p.state||"进度")+(p.seq!=null?" #"+p.seq:""));
 else if(p.topic==="task_succeeded"){st.done=true;st.lines.push("✔ 成功");st.buf=alStreamResultText(p.result);}
 else if(p.topic==="task_failed"){st.done=true;st.failed=true;st.lines.push("✘ 失败: "+(p.error||""));}
 else if(p.topic==="task_declined"){st.done=true;st.failed=true;st.lines.push("⊘ 拒绝: "+(p.reason||""));}
 else if(p.topic==="task_cancelled"){st.done=true;st.lines.push("⊘ 已取消");}
 else if(p.topic==="task_rolled_back"){st.done=true;st.lines.push("⊘ 已回滚");}
 else return {state:state,changed:false};
 return {state:st,changed:true};
}
/* 逐字推进：shown 每拍最多长出 chars 个字符，永不超出 target。 */
function alStreamStep(shown,target,chars){
 const t=target||"",s=shown||"",n=chars>0?chars:1;
 return s.length>=t.length?t:t.slice(0,Math.min(t.length,s.length+n));
}
/* AL-STREAM-END */
/* ---- 流式视图接线（面板/渲染/逐字节拍/观察者 WS 喂数） ---- */
let STREAM=null;
const stOut=document.getElementById("st-out"),stSt=document.getElementById("st-st"),
      stTid=document.getElementById("st-tid");
function stRender(){
 if(!STREAM){stOut.innerHTML="";stSt.textContent="待命";return;}
 const cls=STREAM.failed?"bad":(STREAM.done?"ok":"");
 const body=STREAM.lines.map(esc).join("\n");
 const cursor=(STREAM.buf&&STREAM.shown.length<STREAM.buf.length)?'<span class="cur">▍</span>':"";
 stOut.innerHTML=(body?body+"\n":"")+'<span class="'+cls+'">'+esc(STREAM.shown)+cursor+'</span>';
 stOut.scrollTop=stOut.scrollHeight;
 stSt.textContent=(STREAM.done?(STREAM.failed?"已结束·失败":"已结束"):"流式中")+" · seq="+(STREAM.seq==null?"-":STREAM.seq);
}
function stTick(){if(STREAM&&STREAM.shown.length<STREAM.buf.length){STREAM.shown=alStreamStep(STREAM.shown,STREAM.buf,2);stRender();}}
document.getElementById("st-sub").onclick=()=>{STREAM=alStreamInit(stTid.value.trim());stRender();};
document.getElementById("st-clr").onclick=()=>{STREAM=null;stRender();};
setInterval(stTick,24);
window.__alStream={init:alStreamInit,reduce:alStreamReduce,step:alStreamStep,text:alStreamResultText};

let ws=null,wsRetry=2000,pokeT=null;
function pokePoll(){if(pokeT)return;pokeT=setTimeout(()=>{pokeT=null;poll();},400);}
function connectWS(){if(!TOKEN){setTimeout(connectWS,2000);return;}
 let sk=null;try{sk=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host+"/v1/ws?token="+encodeURIComponent(TOKEN))}catch(e){return;}
 ws=sk;
 sk.onopen=()=>{WSOK=true;wsRetry=2000;renderHud();};
 sk.onmessage=(e)=>{pokePoll();
  /* 流式视图：复用本观察者连接（无 client = 可见本机全部事件含定向帧）。 */
  if(STREAM){let env=null;try{env=JSON.parse(e.data);}catch(err){}
   if(env){const r=alStreamReduce(STREAM,env);if(r.changed){STREAM=r.state;stRender();}}}};
 sk.onerror=()=>{try{sk.close();}catch(e){}};
 sk.onclose=()=>{WSOK=false;if(ws===sk)ws=null;renderHud();setTimeout(connectWS,wsRetry);wsRetry=Math.min(wsRetry*2,30000);};}
addEventListener("message",e=>{if(e.data&&e.data.al==="poke")pokePoll();});
boot().then(connectWS);setInterval(poll,5000);
/* R3-c（10-18 第十五轮）：回前台立刻补一轮 poll——markFreshLive 给"近90s 内未亮过"的消息
   补持久亮线（不重飞粒子，KNOWN 语义不变）；后台积压期间被 KNOWN 吞掉的线从此找得回来。 */
addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")poll();});
/* 诊断快照：外部检查器可读（不影响任何行为；WS 状态机排障用） */
window.__al={get wsok(){return WSOK},get live(){return true},/* R12：时段模式废除，恒为实时 */get polling(){return polling},get tok4(){return (TOKEN||"").slice(0,4)},get livem(){return LIVEM.size},get seen(){return LITSEEN.size},get known(){return KNOWN.size}};
