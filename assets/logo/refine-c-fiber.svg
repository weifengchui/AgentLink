<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentLink refine C">
  <title>AgentLink · 精修 C — 光纤总线（外护套 + 发光纤芯 + 一颗跑动的 packet，最炫）</title>
  <defs>
    <linearGradient id="cG" x1="18" y1="12" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".55" stop-color="#63d2ff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
    <filter id="cGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <path d="M20 16 V40 A8 8 0 0 0 28 48 H44" stroke="url(#cG)" stroke-width="10" opacity=".42"/>
    <path d="M32 48 V55 M41 48 V55" stroke="url(#cG)" stroke-width="2.4" opacity=".62"/>
    <path d="M20 16 V40 A8 8 0 0 0 28 48 H44" stroke="url(#cG)" stroke-width="3.4" filter="url(#cGlow)"/>
  </g>
  <!-- 正在传输的一帧 -->
  <circle cx="34.5" cy="48" r="2.7" fill="#f7ffff" filter="url(#cGlow)"/>
  <!-- 本机端口 -->
  <circle cx="20" cy="16" r="6" fill="#0a1220" stroke="#38e1c6" stroke-width="2.2"/>
  <circle cx="20" cy="16" r="1.8" fill="#38e1c6"/>
  <!-- 对端 -->
  <circle cx="44" cy="48" r="4.4" fill="none" stroke="#e7ecf6" stroke-width="2.2"/>
  <circle cx="44" cy="48" r="1.4" fill="#e7ecf6"/>
  <g fill="#4f8cff" opacity=".85">
    <circle cx="32" cy="55.5" r="2"/><circle cx="41" cy="55.5" r="2"/>
  </g>
</svg>
