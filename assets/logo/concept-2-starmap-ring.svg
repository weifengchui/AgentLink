<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentLink concept 2: Starmap Ring">
  <title>AgentLink · Concept 2 — Starmap Ring（星图环）</title>
  <defs>
    <linearGradient id="c2stream" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
  </defs>
  <!-- 轨道环：多机拓扑的边界 -->
  <circle cx="32" cy="32" r="21" fill="none" stroke="#1b3a6b" stroke-width="2"/>
  <!-- 消息流：沿环的三段贝塞尔，青蓝渐变 = 正在传输 -->
  <g fill="none" stroke="url(#c2stream)" stroke-width="3" stroke-linecap="round">
    <path d="M32 11 A21 21 0 0 1 53 32"/>
    <path d="M53 32 A21 21 0 0 1 32 53"/>
  </g>
  <!-- 跨环直连：agent 之间不必经过中心 -->
  <path d="M32 11 L32 53 M11 32 L53 32" fill="none" stroke="#2a4f80" stroke-width="1.5" opacity="0.55"/>
  <!-- 四个节点：上=本机，右/下/左=对端 agent -->
  <g>
    <circle cx="32" cy="11" r="6" fill="#38e1c6"/>
    <circle cx="53" cy="32" r="5" fill="#4f8cff"/>
    <circle cx="32" cy="53" r="5" fill="#e7ecf6"/>
    <circle cx="11" cy="32" r="5" fill="#4f8cff"/>
  </g>
  <!-- 内核：单二进制调度器 -->
  <circle cx="32" cy="32" r="5.5" fill="#0a1220" stroke="#38e1c6" stroke-width="2.5"/>
</svg>
