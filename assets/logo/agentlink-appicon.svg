<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentLink app icon">
  <title>AgentLink · 应用图标（圆角方底 + 星点 + 发光长颈鹿）</title>
  <defs>
    <radialGradient id="ali-bg" cx=".3" cy=".18" r="1.05">
      <stop offset="0" stop-color="#13233f"/>
      <stop offset=".55" stop-color="#0a1224"/>
      <stop offset="1" stop-color="#04060d"/>
    </radialGradient>
    <linearGradient id="ali-bus" x1="16" y1="56" x2="42" y2="4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".55" stop-color="#63d2ff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
    <filter id="ali-glow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="ali-clip"><rect width="64" height="64" rx="14.5"/></clipPath>
  </defs>
  <g clip-path="url(#ali-clip)">
