      <circle cx="26" cy="5" r=".5"/><circle cx="44" cy="58" r=".6"/>
    </g>
    <circle cx="32" cy="32" r="27" fill="none" stroke="#1b3a6b" stroke-width="1" opacity=".7"/>
    <g transform="translate(32 32) scale(.78) translate(-32 -32)" filter="url(#ali-glow)">
      <g fill="none" stroke="url(#ali-bus)" stroke-linecap="round">
        <path d="M23 44 C21.8 33 24.4 24.6 30 20" stroke-width="7"/>
        <path d="M22 46 H42" stroke-width="7.5"/>
        <path d="M43 44.6 L47.6 40.4" stroke-width="3.6" opacity=".85"/>
        <path d="M27.5 50 V55 M38 50 V55" stroke-width="3.4" opacity=".8"/>
