<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AgentLink refine A">
  <title>AgentLink · 精修 A — 线条总线（回到第一版的骨架：细总线 + 端口节点 + 分支挂对端）</title>
  <defs>
    <linearGradient id="aG" x1="18" y1="12" x2="48" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset=".6" stop-color="#5fc6ff"/>
      <stop offset="1" stop-color="#38e1c6"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round">
    <!-- 分支：一条总线挂两台对端 -->
    <path d="M32 48 V55 M41 48 V55" stroke="url(#aG)" stroke-width="3.4" opacity=".78"/>
    <!-- 主干 L -->
    <path d="M20 16 V40 A8 8 0 0 0 28 48 H44" stroke="url(#aG)" stroke-width="6.5"/>
    <!-- 正在传输的一帧（细亮段，像光纤里的光） -->
    <path d="M31.5 48 H39.5" stroke="#eafcff" stroke-width="2.4"/>
  </g>
  <circle cx="20" cy="16" r="5.6" fill="#0a1220" stroke="#38e1c6" stroke-width="2.4"/>
  <circle cx="44" cy="48" r="4.6" fill="#e7ecf6"/>
  <g fill="#4f8cff">
    <circle cx="32" cy="55.5" r="2.5"/><circle cx="41" cy="55.5" r="2.5"/>
  </g>
</svg>
