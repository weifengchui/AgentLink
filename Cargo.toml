[package]
name = "agentlink"
version = "0.4.13"
edition = "2021"
description = "AgentLink - LAN message bus for AI agents"
license = "MIT"

[[bin]]
name = "agentlink"
path = "src/main.rs"

[features]
default = []
mdns = ["dep:mdns-sd"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "signal", "io-util", "fs", "macros"] }
axum = { version = "0.7", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
socket2 = "0.5"
futures-util = "0.3"
time = { version = "0.3", features = ["formatting", "parsing"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake"] }
local-ip-address = "0.6"
mdns-sd = { version = "0.11", optional = true }

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
